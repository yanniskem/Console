<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body>
<title>Console Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout : écran de console plein cadre — barre d'état, rangée de tuiles, fiche de la tuile active ; le fond lumineux prend la teinte de la tuile choisie */
:root{
  --ink:#061318;
  --line:rgba(214,238,242,.16);
  --fg:#ecf5f6;
  --muted:#93adb2;
  --accent:#ffb46a;
  --ok:#5fe3a0;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gutter:clamp(16px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-inline:var(--gutter);padding-block:clamp(14px,3vh,30px)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Démarrage */
#boot{align-items:center;justify-content:center;gap:26px;text-align:center;cursor:pointer;transition:opacity .6s,transform .6s}
#boot.leaving{opacity:0;transform:scale(1.06)}
.mark{width:92px;height:92px;border-radius:50%;border:2px solid rgba(236,245,246,.85);position:relative;animation:spin 7s linear infinite}
.mark::before{content:"";position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(236,245,246,.25)}
.mark::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);top:-8px;left:calc(50% - 7px);box-shadow:0 0 20px var(--accent)}
.brand{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,56px);letter-spacing:.34em;padding-left:.34em}
.press{margin:0;color:var(--muted);font-size:15px;max-width:32ch;line-height:1.5;animation:breathe 2.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.45}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* Accueil */
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:14px}
.profile{display:flex;align-items:center;gap:10px;font-weight:700;border:0;background:none;padding:0;cursor:pointer;color:inherit}
.profile:hover #pname{text-decoration:underline;text-underline-offset:3px}
.pname-in{font:inherit;font-weight:700;background:rgba(236,245,246,.1);border:0;border-radius:10px;padding:7px 10px;color:var(--fg);width:14ch;max-width:45vw;box-shadow:inset 0 0 0 1px var(--line);-webkit-user-select:text;user-select:text}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#ffcf8f,#ff8a5b);color:#2a1206;font-family:var(--display);font-size:14px;font-weight:700}
.status{display:flex;align-items:center;gap:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.pad{display:inline-flex;align-items:center;gap:7px}
.pad i{width:8px;height:8px;border-radius:50%;background:#4d6266}
.pad.on{color:var(--fg)}
.pad.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
#clock{color:var(--fg);font-weight:800;font-size:17px}
.home-main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,3vh,32px)}
.shelf{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.rail-wrap{margin-inline:calc(var(--gutter) * -1);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-block:18px}
.rail-wrap::-webkit-scrollbar{display:none}
.rail{display:flex;gap:clamp(12px,1.6vw,20px);padding-inline:var(--gutter);width:max-content}
.tile{--h:200;--s:78%;flex:none;width:clamp(92px,13vw,148px);aspect-ratio:1;border:0;border-radius:24px;padding:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:linear-gradient(150deg,hsl(var(--h) var(--s) 60%),hsl(calc(var(--h) + 32) calc(var(--s) - 8%) 28%));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 22px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.2,.9,.25,1.2),box-shadow .28s,filter .28s;filter:saturate(.7) brightness(.82)}
.tile svg{width:50%;height:50%}
.tile.sel{transform:scale(1.12);filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 3px var(--fg),0 18px 44px rgba(0,0,0,.5)}
.detail{display:grid;gap:10px;max-width:62ch;min-height:200px;align-content:start}
.detail.swap>*{animation:rise .35s ease both}
.eyebrow{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}
.detail h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,5.6vw,58px);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.desc{margin:0;color:#c6d8db;font-size:16px;line-height:1.55}
.meta{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:999px;padding:12px 26px;cursor:pointer;background:var(--fg);color:var(--ink);font-weight:800;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(236,245,246,.1);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{padding:8px 16px;font-size:13px}
.hints{display:flex;gap:8px 20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.hints span{display:inline-flex;align-items:center;gap:6px}
.key{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 7px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);font-size:11px;font-weight:800;color:var(--fg)}
.hints .touch-hint{display:none}
@media (hover:none){.hints .k{display:none}.hints .touch-hint{display:inline-flex}}

/* Applications */
#app{gap:14px}
.app-bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.app-title{margin:0;font-family:var(--display);font-weight:700;font-size:20px}
.app-hint{color:var(--muted);font-size:13px;flex:1;min-width:0}
.app-score{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.app-body{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:auto}
.stage{display:block;max-width:100%;max-height:100%;border-radius:18px;background:rgba(2,9,12,.7);box-shadow:inset 0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.35);touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.card{pointer-events:auto;background:rgba(6,19,24,.92);border-radius:22px;box-shadow:inset 0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5);padding:24px 28px;display:grid;gap:8px;justify-items:center;text-align:center;max-width:100%;animation:rise .3s ease both}
.card h2{margin:0;font-family:var(--display);font-size:22px}
.card p{margin:0 0 8px;color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:5;background:rgba(6,19,24,.94);box-shadow:inset 0 0 0 1px var(--line);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
#toast.show{animation:rise .3s ease both}

.amb{display:grid;justify-items:center;gap:16px;width:100%}
.amb-viz{width:min(56vmin,100%);aspect-ratio:1;max-width:100%}
.amb-note{margin:0;color:var(--muted);font-size:13px}

.pad-test{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center;width:100%;max-width:980px}
.pad-svg{width:100%;height:auto;max-height:52vh}
.pb{fill:rgba(236,245,246,.1);stroke:rgba(236,245,246,.45);stroke-width:2;transition:fill .08s}
.pb.on{fill:var(--accent);stroke:var(--accent)}
.shell{fill:rgba(236,245,246,.05);stroke:rgba(236,245,246,.3);stroke-width:2}
.pad-info{display:grid;gap:12px;min-width:0}
.pad-name{margin:0;font-weight:800;font-size:15px;overflow-wrap:anywhere}
.pad-sub{margin:0;color:var(--muted);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.gauge{display:grid;grid-template-columns:10ch 1fr;align-items:center;gap:10px;font-size:12px;font-weight:800;color:var(--muted)}
.gauge span{display:block;height:8px;border-radius:99px;background:rgba(236,245,246,.1);overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit}
@media (max-width:640px){.pad-test{grid-template-columns:1fr}}

.settings{width:100%;max-width:640px;display:grid;gap:10px;align-self:start;margin-top:clamp(0px,3vh,32px)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:rgba(6,19,24,.55);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:box-shadow .15s,background .15s}
.srow.focus{background:rgba(236,245,246,.08);box-shadow:inset 0 0 0 2px var(--fg)}
.slabel{font-weight:700}
.sval{display:inline-flex;align-items:center;gap:10px}
.mini{width:32px;height:32px;border-radius:50%;border:0;background:rgba(236,245,246,.1);cursor:pointer;font-weight:800;font-size:16px}
.meter{display:block;width:clamp(80px,24vw,180px);height:8px;border-radius:99px;background:rgba(236,245,246,.12);overflow:hidden;cursor:pointer}
.meter i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.pct{min-width:4.5ch;text-align:right;font-variant-numeric:tabular-nums}
.switch{display:inline-flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--muted);padding:0}
.switch i{display:block;width:46px;height:26px;border-radius:99px;background:rgba(236,245,246,.16);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch.on{color:var(--fg)}
.switch.on i{background:var(--ok)}
.switch.on i::after{transform:translateX(20px)}
.legend{margin-top:6px;padding:16px 18px;border-radius:16px;background:rgba(6,19,24,.4);box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:8px;font-size:13px;color:var(--muted)}
.legend div{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.legend b{color:var(--fg)}
/* Impact (FPS) : univers sombre fixe, couleurs explicites, HUD inspiré des FPS tactiques */
.fps{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#141a1f;box-shadow:inset 0 0 0 1px var(--line);color:#f4fbfb}
.fps-cv{display:block;width:100%;height:100%;touch-action:none}
.fps-hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.34))}
.smk{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(160,170,186,.95),rgba(122,132,148,.99));opacity:0}
.mini-map{position:absolute;top:12px;left:12px;width:132px;height:132px;border-radius:10px;background:rgba(8,14,18,.62);box-shadow:inset 0 0 0 1px rgba(255,255,255,.16)}
.topc{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:stretch;gap:3px;font-weight:800;font-size:13px;white-space:nowrap}
.topc>span{display:flex;align-items:center;gap:8px;background:rgba(8,14,18,.66);padding:6px 14px}
.topc .me{border-radius:10px 0 0 10px;box-shadow:inset 0 -3px 0 #4ff0c8}
.topc .ld{border-radius:0 10px 10px 0;box-shadow:inset 0 -3px 0 #ff4f5e}
.topc .tm{font-family:var(--display);font-size:16px;background:rgba(8,14,18,.82)}
.topc b{font-family:var(--display);font-size:16px}
.topc .me b{color:#4ff0c8}
.topc .ld b{color:#ff7a85}
.topc small{font-family:var(--body);font-size:10px;letter-spacing:.12em;color:rgba(244,251,251,.6);text-transform:uppercase}
.feed{position:absolute;top:12px;right:12px;display:grid;gap:4px;justify-items:end;font-size:12px;font-weight:800}
.feed div{background:rgba(8,14,18,.66);padding:5px 10px;border-radius:6px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.feed .me{background:rgba(255,180,106,.16);box-shadow:inset 0 0 0 1px rgba(255,180,106,.75)}
.feed span{color:rgba(244,251,251,.6);font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.feed .hs{color:#ff4f5e;font-size:13px;letter-spacing:0}
.dmg{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(214,30,44,.6));opacity:0}
.hitdir{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
.hitdir i{position:absolute;left:-46px;top:-130px;width:92px;height:26px;border-radius:50% 50% 0 0/100% 100% 0 0;background:radial-gradient(ellipse at bottom,rgba(255,60,70,.9),transparent 70%)}
.xh{position:absolute;left:50%;top:50%;--gap:4px;--xc:#4ff0ff}
.xh i{position:absolute;background:var(--xc);box-shadow:0 0 0 1px rgba(0,0,0,.55);width:2px;height:6px;left:-1px;top:-3px;transition:background .1s}
.xh .u{transform:translateY(calc(-1 * var(--gap) - 3px))}
.xh .d{transform:translateY(calc(var(--gap) + 3px))}
.xh .l{width:6px;height:2px;left:-3px;top:-1px;transform:translateX(calc(-1 * var(--gap) - 3px))}
.xh .r{width:6px;height:2px;left:-3px;top:-1px;transform:translateX(calc(var(--gap) + 3px))}
.xh .c{width:2px;height:2px;left:-1px;top:-1px}
.xh.nodot .c{display:none}
.xh.dot .u,.xh.dot .d,.xh.dot .l,.xh.dot .r{display:none}
.xh.dot .c{width:4px;height:4px;left:-2px;top:-2px;border-radius:50%}
.xh.on i{background:#ff5a6a}
.hm{position:absolute;left:50%;top:50%;opacity:0}
.hm i{position:absolute;width:2px;height:8px;background:#fff;left:-1px;top:-4px}
.hm i:nth-child(1){transform:rotate(45deg) translateY(-10px)}
.hm i:nth-child(2){transform:rotate(135deg) translateY(-10px)}
.hm i:nth-child(3){transform:rotate(225deg) translateY(-10px)}
.hm i:nth-child(4){transform:rotate(315deg) translateY(-10px)}
.hm.head i{background:#ff4d5e}
.tag{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);font-size:12px;font-weight:800;color:#ff8f8f;text-shadow:0 1px 3px #000;white-space:nowrap}
.kb{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);display:grid;justify-items:center;gap:8px;opacity:0}
.kbi{display:flex;gap:7px}
.kbi i{width:20px;height:20px;transform:rotate(45deg);border:2px solid #ff4f5e;background:rgba(255,79,94,.22);box-shadow:0 0 14px rgba(255,79,94,.55)}
.kbi i.hs{background:#ff4f5e}
.kb b{font-family:var(--display);font-size:13px;letter-spacing:.2em;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.85);white-space:nowrap}
.fpsc{position:absolute;left:14px;top:152px;font-size:11px;font-weight:700;color:rgba(244,251,251,.55)}
.center-msg{position:absolute;left:50%;top:28%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;font-weight:800;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.vbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:stretch;gap:8px}
.vhp,.abil,.vam{background:linear-gradient(180deg,rgba(8,14,18,.48),rgba(8,14,18,.8));border-radius:10px;padding:8px 12px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.vhp{display:flex;align-items:center;gap:12px}
.vsh{display:flex;align-items:center;gap:5px;color:#9fe8ff;transition:opacity .2s}
.vsh svg{width:16px;height:16px;fill:currentColor}
.vsh b{font-size:16px;font-weight:800}
.vsh.off{opacity:.28}
.vhn b{font-family:var(--display);font-size:28px;line-height:1;display:block}
.vhn span{display:block;width:118px;height:4px;margin-top:5px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.vhn span i{display:block;height:100%;width:100%;background:#f4fbfb}
.abil{display:flex;gap:8px;padding:6px 8px;align-items:center}
.ab{position:relative;width:42px;height:42px;border-radius:8px;background:rgba(255,255,255,.07);display:grid;place-items:center;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);transition:box-shadow .2s}
.ab svg{width:22px;height:22px;stroke:#f4fbfb;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1}
.ab i{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(0,0,0,.62)}
.ab small{position:absolute;right:4px;bottom:2px;font-size:9px;font-weight:800;color:rgba(244,251,251,.8);z-index:1}
.ab.ready{box-shadow:inset 0 0 0 1px #4ff0c8,0 0 12px rgba(79,240,200,.35)}
.vam{text-align:right;min-width:100px;display:flex;align-items:baseline;justify-content:flex-end}
.vam b{font-family:var(--display);font-size:28px;line-height:1}
.vam em{font-style:normal;font-weight:700;color:rgba(244,251,251,.65);margin-left:5px;font-size:13px}
.vam.low b{color:#ff5a6a}
.slots{position:absolute;right:14px;bottom:14px;display:grid;gap:3px;justify-items:end;font-size:12px;font-weight:800;color:rgba(244,251,251,.42)}
.slots div{display:flex;gap:8px;align-items:center;padding:4px 10px;border-radius:6px}
.slots small{font-size:10px;opacity:.8}
.slots .on{color:#f4fbfb;background:rgba(8,14,18,.62);box-shadow:inset -3px 0 0 #4ff0c8}
.fps-board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(400px,calc(100% - 32px));background:rgba(5,12,15,.9);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.board{width:100%;border-collapse:collapse;font-size:14px;color:#f4fbfb}
.board th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,251,251,.6)}
.board th,.board td{padding:7px 8px;text-align:left}
.board td+td,.board th+th{text-align:right;font-variant-numeric:tabular-nums}
.board tr.me td{color:#ffb46a;font-weight:800}
.board tr+tr td{border-top:1px solid rgba(255,255,255,.1)}
.touch{position:absolute;inset:0;pointer-events:none}
.stick{position:absolute;width:110px;height:110px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28);display:none}
.stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(244,251,251,.38)}
.tbtn{position:absolute;border-radius:50%;border:0;background:rgba(244,251,251,.18);color:#f4fbfb;font-weight:800;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.tbtn.fire{right:20px;bottom:112px;width:78px;height:78px}
.tbtn.jump{right:112px;bottom:76px;width:54px;height:54px}
.tbtn.rel{right:30px;bottom:204px;width:50px;height:50px;font-size:12px}
.tbtn.sw{right:112px;bottom:146px;width:50px;height:50px;font-size:11px}
.tbtn.dash{right:96px;bottom:212px;width:46px;height:46px;font-size:13px}
.fps-menu{position:absolute;inset:0;display:flex;background:linear-gradient(90deg,rgba(4,10,13,.86),rgba(4,10,13,.55));padding:16px;overflow:auto;-webkit-user-select:none;user-select:none}
.fps-panel{width:min(480px,100%);display:grid;gap:9px;margin:auto}
.fps-panel h2{margin:0;font-family:var(--display);font-size:clamp(26px,5vw,40px);text-wrap:balance}
.fps-panel .sub{margin:0 0 4px;color:#b9cdd1;font-size:14px;line-height:1.55}
.ctl{display:grid;gap:8px;margin-bottom:6px;font-size:12.5px;line-height:1.5;color:#a9bfc3}
.ctl b{display:block;color:#f4fbfb;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.warn{margin:0 0 6px;padding:10px 12px;border-radius:12px;background:rgba(255,180,106,.12);color:#ffcf9e;font-size:13px;line-height:1.5}
.opts{display:grid;gap:7px}

<script>
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem('nova.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('nova.'+k,JSON.stringify(v))}catch(e){}}
};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const settings=Object.assign({volume:.7,sfx:true,motion:!reduceMotion},store.get('settings',{}));
function saveSettings(){store.set('settings',settings);if(master)master.gain.value=settings.volume;}

/* ---------- Son : tout est synthétisé en direct ---------- */
let ac=null,master=null;
function audio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=settings.volume;master.connect(ac.destination);}catch(e){return null}}
  if(ac.state==='suspended')ac.resume().catch(()=>{});
  return ac;
}
function tone(freq,dur,o={}){
  if(!settings.sfx&&!o.force)return;const c=audio();if(!c)return;
  const {type='sine',gain=.2,when=0,slide=0,attack=.005}=o;
  const t=c.currentTime+when,osc=c.createOscillator(),g=c.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,t);
  if(slide)osc.frequency.exponentialRampToValueAtTime(freq*slide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g).connect(master);osc.start(t);osc.stop(t+dur+.05);
}
const sfx={
  move(){tone(1320,.06,{gain:.07});tone(1980,.05,{gain:.03,when:.012});},
  ok(){tone(660,.12,{type:'triangle',gain:.14});tone(990,.2,{type:'triangle',gain:.12,when:.07});},
  back(){tone(740,.1,{type:'triangle',gain:.12});tone(494,.18,{type:'triangle',gain:.1,when:.06});},
  hit(f=520){tone(f,.07,{type:'square',gain:.045});},
  bad(){tone(220,.35,{type:'sawtooth',gain:.06,slide:.5});},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,{type:'triangle',gain:.1,when:i*.09}));},
  boot(){
    if(!settings.sfx)return;const c=audio();if(!c)return;const t=c.currentTime;
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(4200,t+1.6);f.connect(master);
    [196,293.66,392,493.88,587.33].forEach((fr,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=i%2?'triangle':'sine';o.frequency.value=fr;o.detune.value=(i-2)*4;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.4+i*.12);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g).connect(f);o.start(t+i*.1);o.stop(t+3.4);});
    tone(1568,1,{gain:.05,when:.9});
  }
};

/* ---------- Fond animé ---------- */
const bg=$('#bg'),bx=bg.getContext('2d');let hueNow=200,hueTarget=200;
function sizeBg(){bg.width=innerWidth;bg.height=innerHeight;}
addEventListener('resize',sizeBg);sizeBg();
const blobs=[0,1,2,3].map(i=>({x:Math.random(),y:Math.random(),r:.35+Math.random()*.3,s:.00004+Math.random()*.00006,p:Math.random()*6.28,o:i*36-54}));
function drawBg(t){
  hueNow+=((((hueTarget-hueNow)%360)+540)%360-180)*.04;
  const w=bg.width,h=bg.height,k=settings.motion?t:0;
  bx.fillStyle=`hsl(${hueNow} 45% 6%)`;bx.fillRect(0,0,w,h);
  bx.globalCompositeOperation='lighter';
  for(const b of blobs){const x=(b.x+Math.sin(k*b.s*6+b.p)*.12)*w,y=(b.y+Math.cos(k*b.s*5+b.p)*.1)*h,r=b.r*Math.max(w,h);
    const g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${hueNow+b.o} 70% 45% / .2)`);g.addColorStop(1,'hsla(0 0% 0% / 0)');bx.fillStyle=g;bx.fillRect(0,0,w,h);}
  bx.globalCompositeOperation='source-over';
  bx.strokeStyle=`hsla(${hueNow+30} 80% 75% / .07)`;bx.lineWidth=1.5;
  for(let j=0;j<3;j++){bx.beginPath();for(let i=0;i<=60;i++){const x=i/60*w,y=h*(.64+j*.06)+Math.sin(i/10+k*.0004+j)*h*.04;i?bx.lineTo(x,y):bx.moveTo(x,y);}bx.stroke();}
}

/* ---------- Horloge et notifications ---------- */
function tick(){$('#clock').textContent=new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
tick();setInterval(tick,5000);
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600);}

/* ---------- Entrées : clavier, souris, manette ---------- */
const held={left:false,right:false,up:false,down:false};let padHeld={},padX=0,padPrev=[],padIdx=null,padDir=null,padRep=0;
function isHeld(d){return !!(held[d]||padHeld[d]);}
const KEYS={arrowleft:'left',arrowright:'right',arrowup:'up',arrowdown:'down',q:'left',a:'left',d:'right',z:'up',w:'up',s:'down',enter:'ok',' ':'ok',escape:'back',backspace:'back',h:'home'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const a=KEYS[e.key.toLowerCase()];if(!a)return;
  e.preventDefault();audio();
  if(a in held)held[a]=true;
  dispatch(a,'kbd');
});
addEventListener('keyup',e=>{const a=KEYS[e.key.toLowerCase()];if(a in held)held[a]=false;});
addEventListener('blur',()=>{for(const k in held)held[k]=false;});

function updatePadStatus(p){const el=$('#pad-status');el.classList.toggle('on',!!p);el.querySelector('span').textContent=p?'Manette connectée':'Aucune manette';}
addEventListener('gamepadconnected',e=>{padIdx=e.gamepad.index;updatePadStatus(e.gamepad);toast('Manette connectée');sfx.ok();});
addEventListener('gamepaddisconnected',e=>{if(padIdx===e.gamepad.index){padIdx=null;updatePadStatus(null);toast('Manette déconnectée');}});
function getPad(){
  const ps=navigator.getGamepads?navigator.getGamepads():[];
  if(padIdx!=null&&ps[padIdx])return ps[padIdx];
  for(const p of ps)if(p){padIdx=p.index;updatePadStatus(p);return p;}
  return null;
}
const PADMAP={0:'ok',1:'back',9:'start',16:'home'};
function pollPad(t){
  const p=getPad();
  if(!p){padX=0;padHeld={};return;}
  p.buttons.forEach((b,i)=>{const on=b.pressed;if(on&&!padPrev[i]&&PADMAP[i])dispatch(PADMAP[i],'pad');padPrev[i]=on;});
  const ax=p.axes[0]||0,ay=p.axes[1]||0,B=i=>!!(p.buttons[i]&&p.buttons[i].pressed);
  padX=Math.abs(ax)>.18?ax:0;
  padHeld={left:B(14)||ax<-.5,right:B(15)||ax>.5,up:B(12)||ay<-.5,down:B(13)||ay>.5};
  let dir=B(14)?'left':B(15)?'right':B(12)?'up':B(13)?'down':null;
  if(!dir&&(Math.abs(ax)>.6||Math.abs(ay)>.6))dir=Math.abs(ax)>Math.abs(ay)?(ax>0?'right':'left'):(ay>0?'down':'up');
  if(dir){if(dir!==padDir){padDir=dir;padRep=t+380;dispatch(dir,'pad');}else if(t>padRep){padRep=t+130;dispatch(dir,'pad');}}
  else padDir=null;
}
/* ---------- Navigation générale ---------- */
let mode='boot',current=null,sel=store.get('sel',0);
function dispatch(a,src){
  if(mode==='boot'){startHome();return;}
  if(mode==='home'){if(a==='start')a='ok';homeInput(a);return;}
  if(mode==='app'){
    if(a==='home'){if(src==='kbd'&&current&&current.opaque)return;closeApp();return;}
    if(current&&current.input&&current.input(a,src))return;
    if(a==='back'||a==='start')closeApp();
  }
}
function startHome(){
  if(mode!=='boot')return;audio();sfx.boot();mode='home';
  $('#boot').classList.add('leaving');
  setTimeout(()=>{$('#boot').hidden=true;$('#home').hidden=false;select(sel,false);},settings.motion?650:0);
}

const rail=$('#rail');

}
function select(i,sound){

function makeStage(body,land,port){
  const c=document.createElement('canvas');c.className='stage';body.append(c);
  const r0=body.getBoundingClientRect();const [W,H]=r0.height>r0.width*1.05?port:land;
  const d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;const ctx=c.getContext('2d');ctx.scale(d,d);
  const fit=()=>{const r=body.getBoundingClientRect();const s=Math.min(r.width/W,r.height/H);c.style.width=W*s+'px';c.style.height=H*s+'px';};
  fit();addEventListener('resize',fit);

}
function overlay(body,title,text,label,onBtn){

/* ---------- Jeu : Rebond (casse-briques à niveaux) ---------- */

    {name:'Échauffement',f:r=>r<5?'n':''},
    {name:'Pyramide',f:(r,k,C)=>r<6&&Math.abs(k-(C-1)/2)<=r+.5?(r<2?'t':'n'):''},
    {name:'Damier',f:(r,k)=>r<7&&(r+k)%2===0?(r%3===0?'t':'n'):''},

    {name:'Rempart',f:(r,k)=>r===3?(k%3===1?'':'s'):r<3?'t':r<6?'n':''},
    {name:'Rayures',f:(r,k)=>r<7?(r%2?'n':'t'):''},

  function serve(){

  const toLocal=e=>{const r=c.getBoundingClientRect();return(e.clientX-r.left)/r.width*W;};

  addEventListener('keydown',onKey);
  function burst(x,y,h,n){for(let i=0;i<(n||10);i++)parts.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,h});}

  function physics(k){

  }
  function draw(){

    ctx.fillStyle='rgba(236,245,246,.55)';ctx.font='800 12px Manrope, system-ui, sans-serif';ctx.textAlign='left';ctx.fillText(`NIVEAU ${lvl} · ${L().name.toUpperCase()}`,side,32);

        ctx.fillStyle='rgba(30,36,40,.55)';for(const dx of[5,bw-5])ctx.fillRect(b.x+dx-1.5,b.y+bh/2-1.5,3,3);continue;}

      ctx.fillStyle='#061318';ctx.font='800 11px Manrope, system-ui, sans-serif';ctx.textAlign='center';ctx.fillText(cp.t==='V'?'♥':cp.t,cp.x,cp.y+4);}

/* ---------- Jeu : Serpent (niveaux avec obstacles) ---------- */
function Serpent(body){
  const S=makeStage(body,[800,520],[480,640]),{ctx,W,H,c}=S,CS=20,GC=W/CS,GR=H/CS,cx=Math.floor(GC/2),cy=Math.floor(GR/2),GOAL=10,R=Math.round;
  const DIRS={left:{x:-1,y:0},right:{x:1,y:0},up:{x:0,y:-1},down:{x:0,y:1}};
  const plus=(x0,y0,n,o)=>{for(let i=-n;i<=n;i++){o.push([x0+i,y0],[x0,y0+i]);}return o;};
  const block=(x,y,o)=>{o.push([x,y],[x+1,y],[x,y+1],[x+1,y+1]);return o;};
  const enclos=()=>{const o=[],x0=4,x1=GC-5,y0=3,y1=GR-4;for(let x=x0;x<=x1;x++)if(Math.abs(x-cx)>1)o.push([x,y0],[x,y1]);for(let y=y0;y<=y1;y++)if(Math.abs(y-cy)>1)o.push([x0,y],[x1,y]);return o;};
  const LEVELS=[
    {name:'Plaine',w:()=>[]},
    {name:'Piliers',w:()=>{const o=[];for(const sx of[-1,1])for(const sy of[-1,1])plus(cx+sx*R(GC*.24),cy+sy*R(GR*.28),2,o);return o;}},

      if(clearing&&clearing.rows.includes(y))continue;blk(BX+x*CELL,BY+(y-TOP)*CELL,CELL,PIECES[k].h,dim);}
    if(clearing){const k=clearing.t/.28;for(const y of clearing.rows){const cy=BY+(y-TOP)*CELL,hh=CELL*k;ctx.fillStyle=`rgba(255,255,255,${.35+.6*k})`;rr(ctx,BX+BW*(1-k)/2,cy+(CELL-hh)/2,BW*k,hh,4);ctx.fill();}}

        ctx.fillStyle=`hsla(${h} 85% 65% / .12)`;ctx.strokeStyle=`hsla(${h} 85% 70% / .6)`;ctx.lineWidth=2;rr(ctx,X+2,Y+2,CELL-4,CELL-4,CELL*.18);ctx.fill();ctx.stroke();}

      for(const[x,y]of ROT[cur.k][cur.r]){const py=cur.y+y;if(py<TOP)continue;blk(BX+(cur.x+x)*CELL,BY+(py-TOP)*CELL,CELL,h,fl);}

      ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=12;ctx.fillText(msg,BX+BW/2,BY+BH*.38-(1.4-msgT)*14);ctx.shadowBlur=0;ctx.globalAlpha=1;}

      ctx.font='700 13px Manrope, system-ui, sans-serif';ctx.fillStyle='rgba(236,245,246,.75)';ctx.fillText('P, Start ou toucher pour reprendre',BX+BW/2,BY+BH/2+22);}

  return{hint:'← → déplacer · ↓ descendre · ↑ / X tourner · Z tourner à gauche · Espace poser · C réserve · P pause',update,
    input(a,src){
      if(src==='pad'){if(a==='start'){pause();return true;}if(a==='back')return state!=='over';return true;}
      return a!=='back';
    },
    destroy(){removeEventListener('keydown',onKey);removeEventListener('blur',onBlur);S.cleanup();}};
}

function Ambiance(body){
  const wrap=document.createElement('div');wrap.className='amb';
  wrap.innerHTML='<canvas class="amb-viz" width="600" height="600"></canvas><button class="btn" id="amb-play">Lancer la musique</button><p class="amb-note">Ré mineur pentatonique · 76 bpm · générée en direct</p>';
  body.append(wrap);
  const cv=wrap.querySelector('canvas'),g=cv.getContext('2d'),btn=wrap.querySelector('#amb-play');
  const scale=[293.66,349.23,392,440,523.25,587.33,698.46,783.99];
  let playing=false,timer=null,nodes=[],bus=null,an=null,data=null,nextT=0,beat=0,rot=0;
  function setup(){
    const c=audio();if(!c)return false;if(bus)return true;
    bus=c.createGain();bus.gain.value=0;an=c.createAnalyser();an.fftSize=128;data=new Uint8Array(an.frequencyBinCount);
    const dl=c.createDelay(1),fb=c.createGain(),wet=c.createGain();dl.delayTime.value=.39;fb.gain.value=.38;wet.gain.value=.5;
    bus.connect(an);an.connect(master);bus.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(an);
    return true;
  }
  function drone(){
    const t=ac.currentTime,f=ac.createBiquadFilter(),lfo=ac.createOscillator(),lg=ac.createGain(),dg=ac.createGain();
    f.type='lowpass';f.frequency.value=600;lfo.frequency.value=.07;lg.gain.value=350;lfo.connect(lg).connect(f.frequency);
    dg.gain.value=.06;f.connect(dg).connect(bus);
    [73.42,110,146.83].forEach((fr,i)=>{const o=ac.createOscillator();o.type=i===1?'triangle':'sawtooth';o.frequency.value=fr;o.detune.value=i*5-5;o.connect(f);o.start(t);nodes.push(o);});
    lfo.start(t);nodes.push(lfo);
  }
  function note(t,fr,len){
    const o=ac.createOscillator(),o2=ac.createOscillator(),gg=ac.createGain(),g2=ac.createGain();
    o.type='sine';o2.type='triangle';o.frequency.value=fr;o2.frequency.value=fr*2;g2.gain.value=.25;
    gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(.16,t+.02);gg.gain.exponentialRampToValueAtTime(.0001,t+len);
    o.connect(gg);o2.connect(g2).connect(gg);gg.connect(bus);o.start(t);o2.start(t);o.stop(t+len+.1);o2.stop(t+len+.1);
  }
  function schedule(){
    const spb=60/76/2;
    while(nextT<ac.currentTime+.3){
      if(Math.random()<(beat%4===0?.85:.4)){const fr=scale[Math.floor(Math.random()*scale.length)];note(nextT,fr*(Math.random()<.2?.5:1),1.4+Math.random()*1.2);}
      if(beat%16===0)note(nextT,scale[0]/2,3);
      beat++;nextT+=spb;
    }
  }
  function play(){
    if(playing||!setup())return;playing=true;drone();
    const t=ac.currentTime;bus.gain.cancelScheduledValues(t);bus.gain.setValueAtTime(bus.gain.value,t);bus.gain.linearRampToValueAtTime(.9,t+1.5);
    nextT=t+.1;beat=0;timer=setInterval(schedule,80);btn.textContent='Mettre en pause';setScore('En lecture');
  }
  function stop(){
    if(!playing)return;playing=false;clearInterval(timer);
    const t=ac.currentTime;bus.gain.cancelScheduledValues(t);bus.gain.setValueAtTime(bus.gain.value,t);bus.gain.linearRampToValueAtTime(0,t+.6);

    const s=cv.width,cx=s/2,cy=s/2;g.clearRect(0,0,s,s);
    if(an&&playing)an.getByteFrequencyData(data);

      const v=data&&playing?data[i%data.length]/255:0,a=i/n*Math.PI*2+rot,r0=150,r1=r0+18+v*120;

}

/* ---------- Système : Réglages ---------- */
function Reglages(body){
  const rows=[
    {id:'volume',label:'Volume général',type:'range'},
    {id:'sfx',label:'Effets sonores de l’interface',type:'toggle'},
    {id:'motion',label:'Fond animé',type:'toggle'},
    {id:'reset',label:'Effacer les records (Rebond, Serpent, Blocs)',type:'action'}
  ];
  const ctl=r=>r.type==='range'
    ?'<span class="sval"><button class="mini" data-d="-1" aria-label="Baisser le volume">−</button><span class="meter"><i></i></span><button class="mini" data-d="1" aria-label="Monter le volume">+</button><b class="pct"></b></span>'
    :r.type==='toggle'?`<span class="sval"><button class="switch" id="sw-${r.id}" aria-pressed="false"><i></i><span></span></button></span>`
    :'<span class="sval"><button class="btn ghost small">Effacer</button></span>';
  const wrap=document.createElement('div');wrap.className='settings';
  wrap.innerHTML=rows.map((r,i)=>`<div class="srow" data-i="${i}"><span class="slabel">${r.label}</span>${ctl(r)}</div>`).join('')+
    `<div class="legend">
      <div><span>Choisir, se déplacer</span><b>Flèches · ZQSD · croix · joystick</b></div>
      <div><span>Valider (A = bouton du bas)</span><b>Entrée · Espace · A</b></div>
      <div><span>Retour (B = bouton de droite)</span><b>Échap · Retour arrière · B</b></div>
      <div><span>Revenir à l’accueil</span><b>H · Start · bouton central</b></div>
    </div>`;
  body.append(wrap);
  let f=0;
  function render(){
    [...wrap.querySelectorAll('.srow')].forEach((row,i)=>row.classList.toggle('focus',i===f));
    const v=Math.round(settings.volume*100);wrap.querySelector('.meter i').style.width=v+'%';wrap.querySelector('.pct').textContent=v+' %';
    ['sfx','motion'].forEach(id=>{const el=wrap.querySelector('#sw-'+id);el.classList.toggle('on',!!settings[id]);el.setAttribute('aria-pressed',!!settings[id]);el.querySelector('span').textContent=settings[id]?'Activé':'Désactivé';});
  }
  function change(i,d){
    const r=rows[i];
    if(r.type==='range'){if(!d)return;settings.volume=Math.max(0,Math.min(1,Math.round((settings.volume+d*.1)*10)/10));saveSettings();sfx.move();}
    else if(r.type==='toggle'){settings[r.id]=!settings[r.id];saveSettings();sfx.move();}
    else if(!d){store.set('best-rebond',0);store.set('best-serpent',0);store.set('best-blocs',0);toast('Records effacés');sfx.back();}
    render();
  }
  wrap.addEventListener('click',e=>{
    const row=e.target.closest('.srow');if(!row)return;f=+row.dataset.i;
    const m=e.target.closest('.mini');if(m){change(f,+m.dataset.d);return;}
    const mt=e.target.closest('.meter');
    if(mt){const r=mt.getBoundingClientRect();settings.volume=Math.round(Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*10)/10;saveSettings();sfx.move();render();return;}
    if(rows[f].type!=='range')change(f,0);else render();
  });
  render();setScore('');
  return{hint:'↑ ↓ choisir · ← → régler · Entrée / A valider',
    input(a){
      if(a==='up'||a==='down'){f=(f+(a==='up'?-1:1)+rows.length)%rows.length;sfx.move();render();return true;}
      if(a==='left'||a==='right'){change(f,a==='left'?-1:1);return true;}
      if(a==='ok'){change(f,0);return true;}
      return false;
    }};
}

// relief : carte de normales calculée depuis la luminance d'une texture (partagé par les jeux 3D)
function novaNormal(t,strength){
  const src=t.image,s=src.width,h=src.height,c=document.createElement('canvas');c.width=s;c.height=h;const g=c.getContext('2d'),d=src.getContext('2d').getImageData(0,0,s,h).data,out=g.createImageData(s,h),o=out.data;
  const L=(x,y)=>{const i=(((y+h)%h)*s+((x+s)%s))*4;return(d[i]*.3+d[i+1]*.59+d[i+2]*.11)/255;};
  for(let y=0;y<h;y++)for(let x=0;x<s;x++){const dx=(L(x+1,y)-L(x-1,y))*strength,dy=(L(x,y+1)-L(x,y-1))*strength,l=Math.hypot(dx,dy,1),i=(y*s+x)*4;o[i]=(-dx/l*.5+.5)*255;o[i+1]=(dy/l*.5+.5)*255;o[i+2]=(1/l*.5+.5)*255;o[i+3]=255;}
  g.putImageData(out,0,0);const n=new THREE.CanvasTexture(c);n.wrapS=n.wrapT=THREE.RepeatWrapping;n.repeat.copy(t.repeat);n.anisotropy=t.anisotropy;return n;
}

function NovaPost(renderer){
  const gl2=renderer.capabilities.isWebGL2,hdr=gl2&&!!renderer.extensions.get('EXT_color_buffer_float');
  const TYPE=hdr?THREE.HalfFloatType:THREE.UnsignedByteType;
  const qs=new THREE.Scene(),qc=new THREE.OrthographicCamera(-1,1,1,-1,0,1),qg=new THREE.BufferGeometry();
  qg.setAttribute('position',new THREE.Float32BufferAttribute([-1,-1,0,3,-1,0,-1,3,0],3));qg.setAttribute('uv',new THREE.Float32BufferAttribute([0,0,2,0,0,2],2));
  const quad=new THREE.Mesh(qg);quad.frustumCulled=false;qs.add(quad);
  const VS='varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}';
  const mk=(fs,u)=>new THREE.ShaderMaterial({vertexShader:VS,fragmentShader:fs,uniforms:u,depthTest:false,depthWrite:false});
  // réduction 13 points (filtre doux, sans scintillement) ; la première passe ne garde que les zones très lumineuses
  const down=mk(`uniform sampler2D t;uniform vec2 px;uniform float thr,first;varying vec2 vUv;
    vec3 S(vec2 o){return texture2D(t,vUv+o*px).rgb;}
    void main(){vec3 a=S(vec2(-1.,-1.)),b=S(vec2(1.,-1.)),c=S(vec2(-1.,1.)),d=S(vec2(1.,1.)),e=S(vec2(-2.,-2.)),f=S(vec2(0.,-2.)),g=S(vec2(2.,-2.)),
      h=S(vec2(-2.,0.)),i=S(vec2(0.)),j=S(vec2(2.,0.)),k=S(vec2(-2.,2.)),l=S(vec2(0.,2.)),m=S(vec2(2.,2.));
      vec3 col=(a+b+c+d)*.125+(e+g+k+m)*.03125+(f+h+j+l)*.0625+i*.125;
      if(first>.5){float br=max(col.r,max(col.g,col.b));float sf=clamp(br-thr+.6,0.,1.2);sf=sf*sf*.42;col*=max(sf,br-thr)/max(br,1e-4);col=min(col,vec3(40.));}
      gl_FragColor=vec4(col,1.);}`,{t:{value:null},px:{value:new THREE.Vector2()},thr:{value:1},first:{value:0}});
  const up=mk(`uniform sampler2D t,b;uniform vec2 px;varying vec2 vUv;
    void main(){vec2 o=px;vec3 c=texture2D(t,vUv-o).rgb+texture2D(t,vUv+vec2(0.,-o.y)).rgb*2.+texture2D(t,vUv+vec2(o.x,-o.y)).rgb
      +texture2D(t,vUv+vec2(-o.x,0.)).rgb*2.+texture2D(t,vUv).rgb*4.+texture2D(t,vUv+vec2(o.x,0.)).rgb*2.
      +texture2D(t,vUv+vec2(-o.x,o.y)).rgb+texture2D(t,vUv+vec2(0.,o.y)).rgb*2.+texture2D(t,vUv+o).rgb;
      gl_FragColor=vec4(c/16.+texture2D(b,vUv).rgb,1.);}`,{t:{value:null},b:{value:null},px:{value:new THREE.Vector2()}});
  const comp=mk(`uniform sampler2D tS,tB;uniform float bloom,expo,vig,sat,con,time,grain,split,ca;uniform vec3 tint;uniform vec4 rb0,rb1;varying vec2 vUv;
    vec3 aces(vec3 x){return clamp((x*(2.51*x+.03))/(x*(2.43*x+.59)+.14),0.,1.);}
    vec3 toS(vec3 c){return mix(c*12.92,1.055*pow(c,vec3(1./2.4))-.055,step(.0031308,c));}
    void main(){
      vec4 rb=(split>.5&&vUv.y<.5)?rb1:rb0;

      if(rb.z>.002){vec2 d=vUv-rb.xy;float w=1.;for(int i=1;i<10;i++){float k=float(i)/9.;float wi=1.-k*.6;c+=texture2D(tS,vUv-d*k*rb.z).rgb*wi;w+=wi;}c/=w;}

      tint:{value:new THREE.Color(1,1,1)},rb0:{value:new THREE.Vector4(.5,.5,0,0)},rb1:{value:new THREE.Vector4(.5,.25,0,0)}});
  let W=0,H=0,samples=4,main=null,mips=[],ups=[];const v2=new THREE.Vector2();
  const rt=(w,h)=>{const t=new THREE.WebGLRenderTarget(Math.max(1,w),Math.max(1,h),{type:TYPE,depthBuffer:false,stencilBuffer:false});t.texture.generateMipmaps=false;return t;};

  function alloc(w,h){
    free();W=w;H=h;

    view(x,y,w,h){const pr=renderer.getPixelRatio();main.viewport.set(x*pr,y*pr,w*pr,h*pr);main.scissor.copy(main.viewport);main.scissorTest=true;renderer.setRenderTarget(main);},
    end(o){

    },
    dispose(){free();[down,up,comp].forEach(m=>m.dispose());qg.dispose();}
  };
}

  /* ---------- Intelligence des concurrents ---------- */

  }

  /* ---------- Objets ---------- */

    let tot=0;for(const v of Object.values(tab))tot+=v;let r=Math.random()*tot;for(const[n,v]of Object.entries(tab)){r-=v;if(r<=0)return n;}return'banane';
  }

  /* ---------- Physique ---------- */
  const dist=(a,b)=>Math.hypot(a.x-b.x,a.z-b.z);
  function locate(k){

  function step(k,dt){

      const holdable=k.item==='banane'||k.item==='verte'||k.item==='rouge';

    if(control&&inp.drift&&!k.driftHeld&&k.air&&k.rampT>0&&!k.trick){k.trick=true;k.trickT=.4;if(k.human>=0)tone(1200,.08,{type:'triangle',gain:.08});}
    if(control&&!k.drift&&inp.drift&&!k.air&&Math.abs(k.steerS)>.3&&k.speed>11)k.drift=Math.sign(k.steerS);
    let yr;
    if(k.drift){const into=k.steerS*k.drift;yr=k.drift*turn*1.12*(.6+.45*into);const prev=k.tier;k.charge+=dt*(1+Math.max(0,into)*.9);k.tier=k.charge>=3.1?3:k.charge>=1.95?2:k.charge>=1?1:0;if(k.tier>prev&&k.human>=0)SFX.drift(k.tier);
      if(!inp.drift||!control||k.speed<8||off&&k.boostT<=0){if(control&&!inp.drift&&k.tier>0)boost(k,[0,.6,1.05,1.65][k.tier]);k.drift=0;k.charge=0;k.tier=0;}}

      for(const[px,pz,pr]of world.pillars){const dx=k.x-px,dz=k.z-pz,d=Math.hypot(dx,dz);if(d<pr+KR){const nx=dx/d,nz=dz/d;k.x=px+nx*(pr+KR);k.z=pz+nz*(pr+KR);bounceWall(k,-nx,-nz);}}

    else{k.y=k.gy;k.vy=0;k.air=false;}
    // pièces et boîtes

  /* ---------- Déroulement d'une épreuve ---------- */

    const nAI=mode==='tt'?0:mode==='battle'?Math.max(0,6-humansCi.length):8-humansCi.length;
    const roster=[...humansCi.map((ci,i)=>({ci,human:i,pts:0})),...others.slice(0,nAI).map(ci=>({ci,human:-1,pts:0}))];
    ev={mode,roster,cup:mode==='gp'?[0,1,2,3]:[cfg.track],ri:0,battleT:180};
    startRace();
  }

    else order=[...karts.filter(k=>k.human<0).sort(()=>Math.random()-.5),...humans];

    for(const k of karts){k.rank=order.indexOf(k)+1;if(!world.arena)locate(k);k.y=world.arena?0:k.gy;k.lap=0;k.cp=true;k.prog=-1;if(mode==='battle'){k.balloons=3;updBalloons(k);}
      if(mode==='tt'&&k.human>=0){k.item='piment3';k.count=3;}}
    projs=[];raceT=-4;countT=4;introT=mode==='battle'?1.5:3.2;state='intro';eclairT=-99;
    // fantôme du contre-la-montre
    ghostRec=null;ghostPlay=null;ghostMesh=null;
    if(mode==='tt'){const rec=store.get('kz-tt-'+KZ_TRACKS[ev.cup[0]].id+(KZ_CC[cfg.cc].mirror?'-m':''),null);ghostRec={pts:[],done:false};
      if(rec&&rec.g){ghostPlay=rec.g;const gm=kartModel(KZ_CHARS[rec.ci||0],true);ghostMesh=gm.g;scene.add(ghostMesh);}}

    const r=[...karts].sort((a,b)=>{if(a.finished&&b.finished)return a.finT-b.finT;if(a.finished)return -1;if(b.finished)return 1;return b.prog-a.prog;});r.forEach((k,i)=>k.rank=i+1);

    rankKarts();
    const res=[...karts].sort((a,b)=>a.rank-b.rank);
    if(ev.mode==='tt'){
      const k=humans[0],tr=KZ_TRACKS[ev.cup[0]],key='kz-tt-'+tr.id+(KZ_CC[cfg.cc].mirror?'-m':''),old=store.get(key,null),total=k.finT,best=Math.min(...k.lapTimes);
      const isRec=k.finished&&(!old||total<old.total);
      if(isRec)store.set(key,{total,lap:best,ci:k.ci,g:ghostRec.pts});
      showMenu(isRec?'Nouveau record !':'Contre-la-montre',`${tr.name} · temps ${k.finished?fmtT(total):'—'} · meilleur tour ${isFinite(best)?fmtT(best):'—'}${old?' · record précédent '+fmtT(old.total):''}`,[
        {label:'Réessayer',go:true,ok:startRace},{label:'Changer de circuit',ok:pickTrack},{label:'Menu Turbo Zoo',ok:titleMenu},{label:'Quitter vers l’accueil',ok:()=>closeApp()}],
        `<table class="board"><tr><th>Tour</th><th>Temps</th></tr>${k.lapTimes.map((t,i)=>`<tr${t===best?' class="me"':''}><td>Tour ${i+1}</td><td>${fmtT(t)}</td></tr>`).join('')}</table>`);
      return;
    }
    if(ev.mode==='battle'){
      const w=res[0];sfx.win();
      showMenu(w.human>=0?(cfg.players===2?`Joueur ${w.human+1} gagne !`:'Victoire !'):`${w.ch.name} gagne la bataille`,'Bataille de ballons',[
        {label:'Rejouer',go:true,ok:startRace},{label:'Menu Turbo Zoo',ok:titleMenu},{label:'Quitter vers l’accueil',ok:()=>closeApp()}],
        `<table class="board"><tr><th>Place</th><th>Pilote</th><th>Ballons</th></tr>${res.map(k=>`<tr class="${k.human>=0?'me':''}"><td>${k.rank}</td><td>${k.ch.emo} ${k.ch.name}${k.human>=0&&cfg.players===2?' (J'+(k.human+1)+')':''}</td><td>${k.balloons}</td></tr>`).join('')}</table>`);
      return;
    }
    res.forEach((k,i)=>{k.gain=KZ_POINTS[i]||0;k.entry.pts+=k.gain;});
    const tr=KZ_TRACKS[ev.cup[ev.ri]],gp=ev.mode==='gp',lastRace=!gp||ev.ri>=ev.cup.length-1;
    const table=`<table class="board"><tr><th>Place</th><th>Pilote</th><th>Temps</th>${gp?'<th>Points</th>':''}</tr>${res.map(k=>`<tr class="${k.human>=0?'me':''}"><td>${k.rank}</td><td>${k.ch.emo} ${k.ch.name}${k.human>=0&&cfg.players===2?' (J'+(k.human+1)+')':''}</td><td>${k.finished?fmtT(k.finT):'—'}</td>${gp?`<td>${k.entry.pts} <small>+${k.gain}</small></td>`:''}</tr>`).join('')}</table>`;
    const best=humans.reduce((a,b)=>a.rank<b.rank?a:b);
    if(gp&&lastRace){
      const st=[...ev.roster].sort((a,b)=>b.pts-a.pts),hp=st.findIndex(r=>r.human>=0)+1,cup=['🏆 Coupe d’or','🥈 Coupe d’argent','🥉 Coupe de bronze'][hp-1];
      if(hp<=3)sfx.win();
      showMenu(cup?cup+' !':'Grand Prix terminé',`Classement final de la Coupe Feuille : ${ordinal(hp)} place.`,[
        {label:'Nouveau Grand Prix',go:true,ok:startEvent},{label:'Menu Turbo Zoo',ok:titleMenu},{label:'Quitter vers l’accueil',ok:()=>closeApp()}],
        `<table class="board"><tr><th>Rang</th><th>Pilote</th><th>Points</th></tr>${st.map((r,i)=>`<tr class="${r.human>=0?'me':''}"><td>${i+1}</td><td>${KZ_CHARS[r.ci].emo} ${KZ_CHARS[r.ci].name}</td><td>${r.pts}</td></tr>`).join('')}</table>`);
      return;
    }
    showMenu(`${tr.emo} ${tr.name}`,`Tu termines ${ordinal(best.rank)}${gp?` · course ${ev.ri+1}/${ev.cup.length}`:''}.`,gp?[
      {label:'Course suivante',go:true,ok:()=>{ev.ri++;startRace();}},{label:'Abandonner le Grand Prix',ok:titleMenu}]:[
      {label:'Rejouer',go:true,ok:startRace},{label:'Changer de circuit',ok:pickTrack},{label:'Menu Turbo Zoo',ok:titleMenu},{label:'Quitter vers l’accueil',ok:()=>closeApp()}],table);
  }
  function pauseMenu(){
    if(state!=='race'&&state!=='count'&&state!=='intro')return;const prev=state;state='pause';hudsEl.hidden=true;stopEngines();if(mus)mus.bus.gain.value=.05;
    showMenu('Pause','',[
      {label:'Reprendre',go:true,ok:()=>{menu.hidden=true;hudsEl.hidden=false;state=prev;startEngines();if(mus)mus.bus.gain.value=.16;}},
      {label:'J1 · Direction assistée',value:()=>yn(cfg.a1s),change:()=>{cfg.a1s=!cfg.a1s;save();}},
      {label:'J1 · Accélération auto',value:()=>yn(cfg.a1a),change:()=>{cfg.a1a=!cfg.a1a;save();}},
      ...(cfg.players===2?[{label:'J2 · Direction assistée',value:()=>yn(cfg.a2s),change:()=>{cfg.a2s=!cfg.a2s;save();}},{label:'J2 · Accélération auto',value:()=>yn(cfg.a2a),change:()=>{cfg.a2a=!cfg.a2a;save();}}]:[]),
      {label:'Qualité graphique',value:()=>QUAL[cfg.q].n,change:d=>{cfg.q=(cfg.q+d+QUAL.length)%QUAL.length;save();applyQuality(state==='menu');}},
      {label:'Recommencer la course',ok:startRace},
      {label:'Menu Turbo Zoo',ok:titleMenu},
      {label:'Quitter vers l’accueil',ok:()=>closeApp()}
    ]);
  }

  /* ---------- Boucle ---------- */
  let cams=[],lastW=0,lastH=0,post=null;
  function updCam(k,cam,dt,i){
    const c=k.cam,fx=Math.sin(k.yaw),fz=Math.cos(k.yaw),back=k.inp.look?-1:1,dist2=k.shrinkT>0?5.5:7.2;
    let tx=k.x-fx*dist2*back,tz=k.z-fz*dist2*back,ty=k.y+3.1;
    if(state==='intro'&&!world.arena){const a=introT*.55+i,s0=world.S[0];tx=s0.x+Math.cos(a)*30;tz=s0.z+Math.sin(a)*30;ty=s0.y+12;cam.position.set(tx,ty,tz);cam.lookAt(s0.x,s0.y,s0.z);return;}
    if(!c.init){c.x=tx;c.y=ty;c.z=tz;c.init=true;}
    const f=1-Math.exp(-dt*(k.inp.look?30:7));c.x+=(tx-c.x)*f;c.z+=(tz-c.z)*f;c.y+=(ty-c.y)*(1-Math.exp(-dt*5));
    if(k.fallT>0){c.y=Math.max(c.y,k.y+4);}
    cam.position.set(c.x,c.y,c.z);cam.lookAt(k.x+fx*3*back,k.y+1.3,k.z+fz*3*back);
    const tf=72+clamp(k.speed/KZ_CC[cfg.cc].v,0,1.3)*7+(k.boostT>0?8:0);c.fov+=(tf-c.fov)*Math.min(1,dt*4);cam.fov=c.fov;cam.updateProjectionMatrix();
  }
  function update(t){
    if(dead||!renderer)return;
    const raw=last?(t-last)/1000:.016,dt=Math.min(raw,.05);last=t;
    if(world&&state!=='loading'){
      for(const f of decoAnim)f(dt);
      for(const b of boxes){b.ph+=dt;b.m.rotation.set(b.ph*.7,b.ph,0);b.m.position.y=b.y+1.3+Math.sin(b.ph*2)*.15;if(!b.on){b.t-=dt;if(b.t<=0){b.on=true;b.m.visible=true;}}}
      for(const c of coins)c.m.rotation.y+=dt*3;
      if(snowP){const p=humans[0]||{x:world.c[0],z:world.c[1],y:0},a=snowP.geometry.attributes.position,arr=a.array;snowP.position.set(p.x,p.y||0,p.z);for(let i=0;i<arr.length;i+=3){arr[i+1]-=dt*5;if(arr[i+1]<-2)arr[i+1]=38;}a.needsUpdate=true;}
      if(embers){const a=embers.geometry.attributes.position,arr=a.array;for(let i=0;i<arr.length;i+=3){arr[i+1]+=dt*(2+(i%7));if(arr[i+1]>40)arr[i+1]=-3;}a.needsUpdate=true;}
      const tt=t/1000;if(skyMesh)skyMesh.material.uniforms.time.value=tt;for(const m of windMats)if(m.userData.sh)m.userData.sh.uniforms.time.value=tt;
      // l'herbe lointaine n'est pas dessinée
      if(grassChunks.length){const ref=humans.length?humans:[cams[0].position];for(const gc of grassChunks){const[cx,cz]=gc.userData.center;let d=1e9;for(const h of ref)d=Math.min(d,Math.hypot(h.x-cx,h.z-cz));gc.visible=QUAL[cfg.q].grass>0&&!lowGrass&&d<260;}}
      updShadow();
    }
    if(state==='intro'){introT-=dt;if(introT<=0||anyPressed()){state='count';introT=0;}}
    if(state==='count'||state==='race'||state==='done'){
      const sub=state==='race'||state==='done'?Math.max(1,Math.ceil(dt/.017)):1,h=dt/sub;
      if(state==='count'){const prev=countT;countT-=dt;raceT=-countT;
        for(const k of humans){readHuman(k,dt);if(k.inp.thr&&k.startPress<0)k.startPress=countT;if(!k.inp.thr)k.startPress=-1;}taps.clear();
        const c=Math.ceil(countT);if(c!==Math.ceil(prev)&&c>=1&&c<=3){SFX.beep(false);for(const k of humans)k.hud&&(k.hud.lights.hidden=false);}
        for(const k of humans)if(k.hud){const on=4-Math.max(1,c);k.hud.lights.querySelectorAll('i').forEach((el,i)=>{el.className=i<on?'r':'';});}
        if(countT<=0){state='race';raceT=0;SFX.beep(true);
          for(const k of karts){k.lapStart=0;if(k.human>=0){const sp=k.startPress;if(sp>=.7&&sp<=1.5)boost(k,1.1);else if(sp>2.2){k.hitT=.9;k.hitType='spin';}
            if(k.hud){k.hud.lights.querySelectorAll('i').forEach(el=>el.className='g');setTimeout(()=>{if(k.hud)k.hud.lights.hidden=true;},900);}hudMsg(k,'PARTEZ !','',.9);}
            else if(Math.random()<.45)boost(k,.6,false);}
        }
      }
      if(state==='race'||state==='done'){
        raceT+=dt;
        for(const k of karts){if(k.human>=0&&!k.finished)readHuman(k,dt);else aiDrive(k,dt);}taps.clear();
        for(let s=0;s<sub;s++){for(const k of karts)step(k,h);collideKarts();}
        stepProjs(dt);rankKarts();rubberBand();
        // fantôme : enregistre et rejoue la trajectoire
        if(ghostRec&&!ghostRec.done&&humans[0]){const k=humans[0];if(ghostRec.pts.length<raceT*20)ghostRec.pts.push([+k.x.toFixed(1),+k.y.toFixed(2),+k.z.toFixed(1),+k.yaw.toFixed(2)]);}
        if(ghostPlay&&ghostMesh){const f=raceT*20,i=Math.floor(f),a=ghostPlay[Math.min(i,ghostPlay.length-1)],b=ghostPlay[Math.min(i+1,ghostPlay.length-1)],u=f-i;if(a){ghostMesh.position.set(a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,a[2]+(b[2]-a[2])*u);ghostMesh.rotation.y=a[3]+angDiff(b[3],a[3])*u;ghostMesh.visible=i<ghostPlay.length;}}
        // fin de course / de bataille
        if(world.arena){const alive=karts.filter(k=>!k.out);if(state==='race'&&(raceT>=ev.battleT||alive.length<=1||humans.every(h=>h.out))){state='done';endT=2.5;for(const k of humans)hudMsg(k,raceT>=ev.battleT?'TEMPS ÉCOULÉ !':'FIN !','',2.5);}}
        else if(state==='race'&&humans.every(k=>k.finished)){state='done';endT=ev.mode==='tt'?2.5:4.5;}
        else if(state==='race'&&humans.some(k=>k.finished)&&karts.filter(k=>k.finished).length>=Math.min(karts.length,5)&&humans.some(k=>!k.finished)){}
        if(state==='done'){endT-=dt;if(endT<=0)endRace();}
      }else for(const k of karts){k.speed=0;}
      for(const k of karts)poseKart(k,dt);
      for(const k of humans)updHud(k,dt);
      stepParts(dt);updEngines();
    }
    flashT=Math.max(0,flashT-dt);flashEl.style.opacity=(flashT*2.5).toFixed(2);
    perf(raw);
    render(dt);
  }
  // résolution dynamique : vise 60 images/s, baisse puis remonte la résolution interne
  let res=1,lowGrass=false,pN=0,pA=0,upOk=0,slow=0,fpsShown=0;
  function basePR(){return Math.min(devicePixelRatio||1,QUAL[cfg.q].dpr);}
  function setRes(r){res=r;renderer.setPixelRatio(basePR()*res);lastW=0;}
  function perf(raw){
    pN++;pA+=raw;if(pA<1)return;const f=pN/pA;pN=0;pA=0;fpsShown=Math.round(f);
    if(state!=='race'&&state!=='count'&&state!=='intro'&&state!=='menu')return;
    const Q=QUAL[cfg.q],minR=Q.n==='Ultra'?.7:.55;
    if(f<54&&res>minR){setRes(Math.max(minR,res-.1));upOk=0;slow=0;}
    else if(f<44&&res<=minR&&Q.auto){if(++slow>=2){slow=0;if(!lowGrass)lowGrass=true;else if(sun&&sun.castShadow)sun.castShadow=false;}}
    else if(f>58.5&&res<1){if(++upOk>=3){upOk=0;setRes(Math.min(1,res+.05));}}
    else upOk=0;
  }
  function applyQuality(rebuild){
    const Q=QUAL[cfg.q];res=1;lowGrass=false;if(post)post.setSamples(Q.msaa);renderer.setPixelRatio(basePR());lastW=0;
    if(rebuild){world=null;previewTrack(cfg.mode==='battle'?-1:cfg.track);return;}
    if(sun){sun.castShadow=Q.sh>0;if(Q.sh>0&&sun.shadow.mapSize.x!==Q.sh){sun.shadow.mapSize.set(Q.sh,Q.sh);if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}}}
  }
  function anyPressed(){if(keys.size)return true;const p=padsList()[0];return!!(p&&p.buttons.some((b,i)=>b.pressed&&i!==9));}
  function render(dt){
    const w=root.clientWidth||1,h=root.clientHeight||1;if(w!==lastW||h!==lastH){lastW=w;lastH=h;renderer.setSize(w,h,false);}
    const usePost=post&&QUAL[cfg.q].post;
    if(usePost)post.begin();
    const view=(x,y,vw,vh)=>{if(usePost)post.view(x,y,vw,vh);else{renderer.setRenderTarget(null);renderer.setViewport(x,y,vw,vh);renderer.setScissor(x,y,vw,vh);renderer.setScissorTest(true);}};
    const TE=world?{[KZ_THEMES.prairie.ground]:.82,[KZ_THEMES.plage.ground]:.7,[KZ_THEMES.volcan.ground]:1.05,[KZ_THEMES.neige.ground]:.72}[world.th.ground]||.85:.82;
    const fx={bloom:world&&world.th===KZ_THEMES.volcan?.09:.06,expo:TE,vig:.3,sat:1.16,con:1.13,split:0,thr:post&&post.hdr?1.1:.8};
    if(state==='menu'||state==='loading'||!humans.length||state==='results'&&!karts.length){
      const c=cams[0];c.aspect=w/h;const a=performance.now()/1000*.08;
      if(world){const[cx,cz]=world.c,r=world.arena?95:Math.max(world.bb[1]-world.bb[0],world.bb[3]-world.bb[2])*.55;c.position.set(cx+Math.cos(a)*r,world.arena?45:85,cz+Math.sin(a)*r);c.lookAt(cx,0,cz);}
      c.fov=60;c.updateProjectionMatrix();view(0,0,w,h);if(scene)renderer.render(scene,c);
      if(usePost)post.end(fx);return;
    }
    const n=humans.length;
    humans.forEach((k,i)=>{const c=cams[i];const vh=h/n,y=h-(i+1)*vh;c.aspect=w/vh;updCam(k,c,dt,i);view(0,y,w,vh);renderer.render(scene,c);
      // flou radial pendant les turbos, centré sur la vue du joueur
      const target=(k.boostT>0?.07:0)+(k.starT>0?.03:0)+clamp((k.speed-KZ_CC[cfg.cc].v)/KZ_CC[cfg.cc].v,0,.4)*.05;k.blur=(k.blur||0)+(target-(k.blur||0))*Math.min(1,dt*6);
      fx['rb'+i]=[.5,n===1?.56:(i===0?.78:.28),k.blur,0];});
    fx.split=n>1?1:0;
    if(usePost)post.end(fx);
  }
  /* ---------- Entrées clavier et menus ---------- */
  const onKD=e=>{keys.add(e.code);if(!e.repeat)taps.add(e.code);if(state==='race'||state==='count'||state==='done'){if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))e.preventDefault();if(e.code==='KeyP'&&!e.repeat)pauseMenu();}};
  const onKU=e=>{keys.delete(e.code);};
  const onBlur=()=>{keys.clear();};
  addEventListener('keydown',onKD);addEventListener('keyup',onKU);addEventListener('blur',onBlur);
  function input(a,src){
    lastSrc=src;if(state==='loading')return false;
    if(state==='race'||state==='count'||state==='intro'||state==='done'){if(a==='start'||a==='back'&&src==='kbd')pauseMenu();return true;}
    if(state==='pause'&&(a==='start'||a==='back'&&src!=='pad')){const r=mRows[0];if(r&&r.ok)r.ok();return true;}
    if(menuInput(a))return true;
    if(a==='back'&&state==='menu')return false;
    return state!=='menu';
  }
  function destroy(){
    dead=true;stopEngines();stopMusic();removeEventListener('keydown',onKD);removeEventListener('keyup',onKU);removeEventListener('blur',onBlur);
    clearScene();if(post)post.dispose();if(renderer){renderer.dispose();if(renderer.forceContextLoss)renderer.forceContextLoss();}
  }
  function init(){
    renderer=new THREE.WebGLRenderer({canvas:cv,antialias:!QUAL[cfg.q].post,powerPreference:'high-performance',stencil:false});renderer.autoClear=true;
    renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
    post=NovaPost(renderer);post.setSamples(QUAL[cfg.q].msaa);renderer.setPixelRatio(basePR());
    cams=[new THREE.PerspectiveCamera(72,1,.1,1400),new THREE.PerspectiveCamera(72,1,.1,1400)];
    sharedTextures();geos();itemMats();
    titleMenu();
  }
  loadThree().then(()=>{if(!dead)init();}).catch(()=>{if(!dead)menu.innerHTML='<div class="fps-panel"><h2>Turbo Zoo</h2><p class="sub">Le moteur 3D n’a pas pu se charger. Vérifie ta connexion puis relance le jeu.</p></div>';});
  return{opaque:true,hint:'Manette conseillée · A accélérer · RB déraper · LB objet · Start pause',update,input,destroy};
}

/* ---------- Démarrage ---------- */
function frame(t){if(!(current&&current.opaque))drawBg(t);pollPad(t);if(current&&current.update)current.update(t);requestAnimationFrame(frame);}
renderRail();updatePadStatus(null);
let pname=store.get('name','Joueur');
function showName(){$('#pname').textContent=pname;$('#avatar').textContent=(pname.trim()[0]||'J').toUpperCase();}
showName();
$('#profile').addEventListener('click',()=>{const i=$('#pname-in');i.value=pname;$('#profile').hidden=true;i.hidden=false;i.focus();i.select();});
function saveName(){const i=$('#pname-in');if(i.hidden)return;const v=i.value.trim().slice(0,16);if(v){pname=v;store.set('name',pname);}i.hidden=true;$('#profile').hidden=false;showName();}
$('#pname-in').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();if(e.key==='Escape')e.target.value=pname;saveName();}});
$('#pname-in').addEventListener('blur',saveName);
$('#boot').addEventListener('pointerdown',()=>dispatch('ok','ptr'));
$('#d-launch').addEventListener('click',()=>{audio();launch(sel);});
$('#app-back').addEventListener('click',()=>{if(mode==='app')closeApp();});
requestAnimationFrame(frame);
</script>
</body></html>
