<title>Console Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout : écran de console plein cadre — barre d'état, rangée de tuiles, fiche de la tuile active ; le fond lumineux prend la teinte de la tuile choisie */
:root{
  --ink:#061318;
  --line:rgba(214,238,242,.16);
  --fg:#ecf5f6;
  --muted:#93adb2;
  --accent:#ffb46a;
  --ok:#5fe3a0;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gutter:clamp(16px,4vw,56px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--fg);font-family:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.screen{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding-inline:var(--gutter);padding-block:clamp(14px,3vh,30px)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}

/* Démarrage */
#boot{align-items:center;justify-content:center;gap:26px;text-align:center;cursor:pointer;transition:opacity .6s,transform .6s}
#boot.leaving{opacity:0;transform:scale(1.06)}
.mark{width:92px;height:92px;border-radius:50%;border:2px solid rgba(236,245,246,.85);position:relative;animation:spin 7s linear infinite}
.mark::before{content:"";position:absolute;inset:18px;border-radius:50%;border:2px solid rgba(236,245,246,.25)}
.mark::after{content:"";position:absolute;width:14px;height:14px;border-radius:50%;background:var(--accent);top:-8px;left:calc(50% - 7px);box-shadow:0 0 20px var(--accent)}
.brand{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,7vw,56px);letter-spacing:.34em;padding-left:.34em}
.press{margin:0;color:var(--muted);font-size:15px;max-width:32ch;line-height:1.5;animation:breathe 2.6s ease-in-out infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{50%{opacity:.45}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}

/* Accueil */
.bar{display:flex;justify-content:space-between;align-items:center;gap:16px;font-size:14px}
.profile{display:flex;align-items:center;gap:10px;font-weight:700;border:0;background:none;padding:0;cursor:pointer;color:inherit}
.profile:hover #pname{text-decoration:underline;text-underline-offset:3px}
.pname-in{font:inherit;font-weight:700;background:rgba(236,245,246,.1);border:0;border-radius:10px;padding:7px 10px;color:var(--fg);width:14ch;max-width:45vw;box-shadow:inset 0 0 0 1px var(--line);-webkit-user-select:text;user-select:text}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(140deg,#ffcf8f,#ff8a5b);color:#2a1206;font-family:var(--display);font-size:14px;font-weight:700}
.status{display:flex;align-items:center;gap:18px;color:var(--muted);font-variant-numeric:tabular-nums}
.pad{display:inline-flex;align-items:center;gap:7px}
.pad i{width:8px;height:8px;border-radius:50%;background:#4d6266}
.pad.on{color:var(--fg)}
.pad.on i{background:var(--ok);box-shadow:0 0 10px var(--ok)}
#clock{color:var(--fg);font-weight:800;font-size:17px}
.home-main{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,3vh,32px)}
.shelf{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.rail-wrap{margin-inline:calc(var(--gutter) * -1);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;padding-block:18px}
.rail-wrap::-webkit-scrollbar{display:none}
.rail{display:flex;gap:clamp(12px,1.6vw,20px);padding-inline:var(--gutter);width:max-content}
.tile{--h:200;--s:78%;flex:none;width:clamp(92px,13vw,148px);aspect-ratio:1;border:0;border-radius:24px;padding:0;display:grid;place-items:center;cursor:pointer;color:#fff;background:linear-gradient(150deg,hsl(var(--h) var(--s) 60%),hsl(calc(var(--h) + 32) calc(var(--s) - 8%) 28%));box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 8px 22px rgba(0,0,0,.3);transition:transform .28s cubic-bezier(.2,.9,.25,1.2),box-shadow .28s,filter .28s;filter:saturate(.7) brightness(.82)}
.tile svg{width:50%;height:50%}
.tile.sel{transform:scale(1.12);filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 0 0 3px var(--fg),0 18px 44px rgba(0,0,0,.5)}
.detail{display:grid;gap:10px;max-width:62ch;min-height:200px;align-content:start}
.detail.swap>*{animation:rise .35s ease both}
.eyebrow{margin:0;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800}
.detail h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(30px,5.6vw,58px);line-height:1.04;letter-spacing:-.01em;text-wrap:balance}
.desc{margin:0;color:#c6d8db;font-size:16px;line-height:1.55}
.meta{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
.btn{border:0;border-radius:999px;padding:12px 26px;cursor:pointer;background:var(--fg);color:var(--ink);font-weight:800;font-size:15px;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:rgba(236,245,246,.1);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.btn.small{padding:8px 16px;font-size:13px}
.hints{display:flex;gap:8px 20px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.hints span{display:inline-flex;align-items:center;gap:6px}
.key{display:inline-grid;place-items:center;min-width:26px;height:24px;padding:0 7px;border-radius:7px;box-shadow:inset 0 0 0 1px var(--line);font-size:11px;font-weight:800;color:var(--fg)}
.hints .touch-hint{display:none}
@media (hover:none){.hints .k{display:none}.hints .touch-hint{display:inline-flex}}

/* Applications */
#app{gap:14px}
.app-bar{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.app-title{margin:0;font-family:var(--display);font-weight:700;font-size:20px}
.app-hint{color:var(--muted);font-size:13px;flex:1;min-width:0}
.app-score{font-weight:800;font-variant-numeric:tabular-nums;font-size:14px}
.app-body{flex:1;min-height:0;position:relative;display:grid;place-items:center;overflow:auto}
.stage{display:block;max-width:100%;max-height:100%;border-radius:18px;background:rgba(2,9,12,.7);box-shadow:inset 0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.35);touch-action:none;cursor:crosshair}
.overlay{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:16px}
.card{pointer-events:auto;background:rgba(6,19,24,.92);border-radius:22px;box-shadow:inset 0 0 0 1px var(--line),0 24px 60px rgba(0,0,0,.5);padding:24px 28px;display:grid;gap:8px;justify-items:center;text-align:center;max-width:100%;animation:rise .3s ease both}
.card h2{margin:0;font-family:var(--display);font-size:22px}
.card p{margin:0 0 8px;color:var(--muted)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);transform:translateX(-50%);z-index:5;background:rgba(6,19,24,.94);box-shadow:inset 0 0 0 1px var(--line);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
#toast.show{animation:rise .3s ease both}

.amb{display:grid;justify-items:center;gap:16px;width:100%}
.amb-viz{width:min(56vmin,100%);aspect-ratio:1;max-width:100%}
.amb-note{margin:0;color:var(--muted);font-size:13px}

.pad-test{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:24px;align-items:center;width:100%;max-width:980px}
.pad-svg{width:100%;height:auto;max-height:52vh}
.pb{fill:rgba(236,245,246,.1);stroke:rgba(236,245,246,.45);stroke-width:2;transition:fill .08s}
.pb.on{fill:var(--accent);stroke:var(--accent)}
.shell{fill:rgba(236,245,246,.05);stroke:rgba(236,245,246,.3);stroke-width:2}
.pad-info{display:grid;gap:12px;min-width:0}
.pad-name{margin:0;font-weight:800;font-size:15px;overflow-wrap:anywhere}
.pad-sub{margin:0;color:var(--muted);font-size:13px;line-height:1.5;font-variant-numeric:tabular-nums}
.gauge{display:grid;grid-template-columns:10ch 1fr;align-items:center;gap:10px;font-size:12px;font-weight:800;color:var(--muted)}
.gauge span{display:block;height:8px;border-radius:99px;background:rgba(236,245,246,.1);overflow:hidden}
.gauge i{display:block;height:100%;width:0;background:var(--accent);border-radius:inherit}
@media (max-width:640px){.pad-test{grid-template-columns:1fr}}

.settings{width:100%;max-width:640px;display:grid;gap:10px;align-self:start;margin-top:clamp(0px,3vh,32px)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px 16px;flex-wrap:wrap;padding:16px 18px;border-radius:16px;background:rgba(6,19,24,.55);box-shadow:inset 0 0 0 1px var(--line);cursor:pointer;transition:box-shadow .15s,background .15s}
.srow.focus{background:rgba(236,245,246,.08);box-shadow:inset 0 0 0 2px var(--fg)}
.slabel{font-weight:700}
.sval{display:inline-flex;align-items:center;gap:10px}
.mini{width:32px;height:32px;border-radius:50%;border:0;background:rgba(236,245,246,.1);cursor:pointer;font-weight:800;font-size:16px}
.meter{display:block;width:clamp(80px,24vw,180px);height:8px;border-radius:99px;background:rgba(236,245,246,.12);overflow:hidden;cursor:pointer}
.meter i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.pct{min-width:4.5ch;text-align:right;font-variant-numeric:tabular-nums}
.switch{display:inline-flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer;font-weight:700;color:var(--muted);padding:0}
.switch i{display:block;width:46px;height:26px;border-radius:99px;background:rgba(236,245,246,.16);position:relative;transition:background .2s}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch.on{color:var(--fg)}
.switch.on i{background:var(--ok)}
.switch.on i::after{transform:translateX(20px)}
.legend{margin-top:6px;padding:16px 18px;border-radius:16px;background:rgba(6,19,24,.4);box-shadow:inset 0 0 0 1px var(--line);display:grid;gap:8px;font-size:13px;color:var(--muted)}
.legend div{display:flex;justify-content:space-between;gap:4px 12px;flex-wrap:wrap}
.legend b{color:var(--fg)}
/* Impact (FPS) : univers sombre fixe, couleurs explicites */
.fps{position:absolute;inset:0;border-radius:18px;overflow:hidden;background:#141a1f;box-shadow:inset 0 0 0 1px var(--line);color:#f4fbfb}
.fps-cv{display:block;width:100%;height:100%;touch-action:none}
.fps-hud{position:absolute;inset:0;pointer-events:none;font-variant-numeric:tabular-nums}
.mini-map{position:absolute;top:12px;left:12px;width:120px;height:120px;border-radius:12px;background:rgba(5,12,15,.6);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.topc{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:rgba(5,12,15,.62);padding:7px 16px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap}
.topc b{font-family:var(--display);font-size:15px;color:#ffb46a}
.topc .sep{color:rgba(244,251,251,.6)}
.feed{position:absolute;top:12px;right:12px;display:grid;gap:4px;justify-items:end;font-size:12px;font-weight:700}
.feed div{background:rgba(5,12,15,.62);padding:4px 10px;border-radius:8px;white-space:nowrap}
.feed .me{box-shadow:inset 0 0 0 1px #ffb46a}
.feed span{color:#ffb46a;margin:0 4px}
.dmg{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 42%,rgba(214,30,44,.6));opacity:0}
.hitdir{position:absolute;left:50%;top:50%;width:0;height:0;opacity:0}
.hitdir i{position:absolute;left:-46px;top:-130px;width:92px;height:26px;border-radius:50% 50% 0 0/100% 100% 0 0;background:radial-gradient(ellipse at bottom,rgba(255,60,70,.9),transparent 70%)}
.xh{position:absolute;left:50%;top:50%;--gap:5px}
.xh i{position:absolute;background:#f4fbfb;box-shadow:0 0 0 1px rgba(0,0,0,.45);width:2px;height:7px;left:-1px;top:-3.5px;transition:background .1s}
.xh .u{transform:translateY(calc(-1 * var(--gap) - 3.5px))}
.xh .d{transform:translateY(calc(var(--gap) + 3.5px))}
.xh .l{width:7px;height:2px;left:-3.5px;top:-1px;transform:translateX(calc(-1 * var(--gap) - 3.5px))}
.xh .r{width:7px;height:2px;left:-3.5px;top:-1px;transform:translateX(calc(var(--gap) + 3.5px))}
.xh .c{width:2px;height:2px;left:-1px;top:-1px}
.xh.on i{background:#ff6b6b}
.hm{position:absolute;left:50%;top:50%;opacity:0}
.hm i{position:absolute;width:2px;height:8px;background:#fff;left:-1px;top:-4px}
.hm i:nth-child(1){transform:rotate(45deg) translateY(-10px)}
.hm i:nth-child(2){transform:rotate(135deg) translateY(-10px)}
.hm i:nth-child(3){transform:rotate(225deg) translateY(-10px)}
.hm i:nth-child(4){transform:rotate(315deg) translateY(-10px)}
.hm.head i{background:#ff4d5e}
.tag{position:absolute;left:50%;top:calc(50% + 24px);transform:translateX(-50%);font-size:12px;font-weight:800;color:#ff8f8f;text-shadow:0 1px 3px #000;white-space:nowrap}
.pop{position:absolute;left:50%;top:calc(50% + 48px);transform:translateX(-50%);font-family:var(--display);font-size:14px;color:#ffb46a;text-shadow:0 2px 6px rgba(0,0,0,.7);opacity:0;white-space:nowrap}
.fpsc{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);font-size:11px;font-weight:700;color:rgba(244,251,251,.55)}
.center-msg{position:absolute;left:50%;top:28%;transform:translateX(-50%);width:max-content;max-width:calc(100% - 32px);text-align:center;font-weight:800;font-size:15px;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.hp{position:absolute;left:16px;bottom:16px;display:grid;gap:6px}
.hp b,.ammo b{font-family:var(--display);font-size:30px;line-height:1}
.hp span{display:block;width:150px;max-width:36vw;height:6px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.hp span i{display:block;height:100%;width:100%;background:#f4fbfb}
.ammo{position:absolute;right:16px;bottom:16px;text-align:right}
.ammo small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:rgba(244,251,251,.7);font-weight:800;margin-bottom:4px}
.ammo em{font-style:normal;font-weight:700;color:rgba(244,251,251,.7);margin-left:6px;font-size:14px}
.fps-board{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,calc(100% - 32px));background:rgba(5,12,15,.88);border-radius:16px;padding:12px 14px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.board{width:100%;border-collapse:collapse;font-size:14px;color:#f4fbfb}
.board th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:rgba(244,251,251,.6)}
.board th,.board td{padding:7px 8px;text-align:left}
.board td+td,.board th+th{text-align:right;font-variant-numeric:tabular-nums}
.board tr.me td{color:#ffb46a;font-weight:800}
.board tr+tr td{border-top:1px solid rgba(255,255,255,.1)}
.touch{position:absolute;inset:0;pointer-events:none}
.stick{position:absolute;width:110px;height:110px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.28);display:none}
.stick i{position:absolute;left:35px;top:35px;width:40px;height:40px;border-radius:50%;background:rgba(244,251,251,.38)}
.tbtn{position:absolute;border-radius:50%;border:0;background:rgba(244,251,251,.18);color:#f4fbfb;font-weight:800;pointer-events:auto;touch-action:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.tbtn.fire{right:20px;bottom:112px;width:78px;height:78px}
.tbtn.jump{right:112px;bottom:76px;width:54px;height:54px}
.tbtn.rel{right:30px;bottom:204px;width:50px;height:50px;font-size:12px}
.fps-menu{position:absolute;inset:0;display:grid;place-items:center;background:rgba(4,10,13,.68);padding:16px;overflow:auto;-webkit-user-select:none;user-select:none}
.fps-panel{width:min(460px,100%);display:grid;gap:10px}
.fps-panel h2{margin:0;font-family:var(--display);font-size:clamp(26px,5vw,40px);text-wrap:balance}
.fps-panel .sub{margin:0 0 4px;color:#b9cdd1;font-size:14px;line-height:1.55}
.ctl{display:grid;gap:8px;margin-bottom:6px;font-size:12.5px;line-height:1.5;color:#a9bfc3}
.ctl b{display:block;color:#f4fbfb;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.warn{margin:0 0 6px;padding:10px 12px;border-radius:12px;background:rgba(255,180,106,.12);color:#ffcf9e;font-size:13px;line-height:1.5}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:rgba(236,245,246,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);cursor:pointer;font-weight:700}
.opt.focus{box-shadow:inset 0 0 0 2px #f4fbfb;background:rgba(236,245,246,.11)}
.opt .val{display:inline-flex;align-items:center;gap:10px;color:#ffb46a}
.opt .val b{min-width:5ch;text-align:center}
.opt .val button{width:28px;height:28px;border-radius:50%;border:0;background:rgba(236,245,246,.12);color:#f4fbfb;cursor:pointer;font-weight:800}
.opt.go{justify-content:center;background:#f4fbfb;color:#0b1418}
.opt.go.focus{box-shadow:0 0 0 3px #ffb46a}
@media (max-width:560px){.mini-map{width:84px;height:84px}.topc{top:104px;font-size:12px}.feed{top:auto;bottom:70px;right:auto;left:16px;justify-items:start}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div id="toast" role="status" hidden></div>

<div id="boot" class="screen">
  <div class="mark" aria-hidden="true"></div>
  <h1 class="brand">NOVA</h1>
  <p class="press">Clique, appuie sur Entrée ou sur un bouton de ta manette pour démarrer</p>
</div>

<div id="home" class="screen" hidden>
  <header class="bar">
    <div class="who"><button class="profile" id="profile" title="Changer de pseudo"><span class="avatar" id="avatar">J</span><span id="pname">Joueur</span></button><input id="pname-in" class="pname-in" maxlength="16" hidden aria-label="Ton pseudo"></div>
    <div class="status"><span class="pad" id="pad-status"><i></i><span>Aucune manette</span></span><span id="clock">--:--</span></div>
  </header>
  <section class="home-main">
    <div>
      <p class="shelf">Jeux et applications</p>
      <div class="rail-wrap"><div class="rail" id="rail" role="listbox" aria-label="Jeux et applications"></div></div>
    </div>
    <div class="detail" id="detail" aria-live="polite">
      <p class="eyebrow" id="d-kind"></p>
      <h1 id="d-title"></h1>
      <p class="desc" id="d-desc"></p>
      <p class="meta" id="d-meta"></p>
      <div class="actions"><button class="btn" id="d-launch">Lancer</button></div>
    </div>
  </section>
  <footer class="hints">
    <span class="k"><b class="key">← →</b>Choisir</span>
    <span class="k"><b class="key">Entrée</b><b class="key">A</b>Lancer</span>
    <span class="k"><b class="key">Échap</b><b class="key">B</b>Retour</span>
    <span class="k"><b class="key">Start</b>Accueil</span>
    <span class="touch-hint">Touche une tuile pour la choisir, touche-la à nouveau pour la lancer</span>
  </footer>
</div>

<div id="app" class="screen" hidden>
  <header class="app-bar">
    <button class="btn ghost small" id="app-back">← Accueil</button>
    <h2 class="app-title" id="app-title"></h2>
    <span class="app-hint" id="app-hint"></span>
    <span class="app-score" id="app-score"></span>
  </header>
  <div class="app-body" id="app-body"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const store={
  get(k,d){try{const v=localStorage.getItem('nova.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem('nova.'+k,JSON.stringify(v))}catch(e){}}
};
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const settings=Object.assign({volume:.7,sfx:true,motion:!reduceMotion},store.get('settings',{}));
function saveSettings(){store.set('settings',settings);if(master)master.gain.value=settings.volume;}

/* ---------- Son : tout est synthétisé en direct ---------- */
let ac=null,master=null;
function audio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=settings.volume;master.connect(ac.destination);}catch(e){return null}}
  if(ac.state==='suspended')ac.resume().catch(()=>{});
  return ac;
}
function tone(freq,dur,o={}){
  if(!settings.sfx&&!o.force)return;const c=audio();if(!c)return;
  const {type='sine',gain=.2,when=0,slide=0,attack=.005}=o;
  const t=c.currentTime+when,osc=c.createOscillator(),g=c.createGain();
  osc.type=type;osc.frequency.setValueAtTime(freq,t);
  if(slide)osc.frequency.exponentialRampToValueAtTime(freq*slide,t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  osc.connect(g).connect(master);osc.start(t);osc.stop(t+dur+.05);
}
const sfx={
  move(){tone(1320,.06,{gain:.07});tone(1980,.05,{gain:.03,when:.012});},
  ok(){tone(660,.12,{type:'triangle',gain:.14});tone(990,.2,{type:'triangle',gain:.12,when:.07});},
  back(){tone(740,.1,{type:'triangle',gain:.12});tone(494,.18,{type:'triangle',gain:.1,when:.06});},
  hit(f=520){tone(f,.07,{type:'square',gain:.045});},
  bad(){tone(220,.35,{type:'sawtooth',gain:.06,slide:.5});},
  win(){[523,659,784,1047].forEach((f,i)=>tone(f,.3,{type:'triangle',gain:.1,when:i*.09}));},
  boot(){
    if(!settings.sfx)return;const c=audio();if(!c)return;const t=c.currentTime;
    const f=c.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(300,t);f.frequency.exponentialRampToValueAtTime(4200,t+1.6);f.connect(master);
    [196,293.66,392,493.88,587.33].forEach((fr,i)=>{const o=c.createOscillator(),g=c.createGain();o.type=i%2?'triangle':'sine';o.frequency.value=fr;o.detune.value=(i-2)*4;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.08,t+.4+i*.12);g.gain.exponentialRampToValueAtTime(.0001,t+3.2);o.connect(g).connect(f);o.start(t+i*.1);o.stop(t+3.4);});
    tone(1568,1,{gain:.05,when:.9});
  }
};

const bg=$('#bg'),bx=bg.getContext('2d');let hueNow=200,hueTarget=200;
function sizeBg(){bg.width=innerWidth;bg.height=innerHeight;}
addEventListener('resize',sizeBg);sizeBg();
const blobs=[0,1,2,3].map(i=>({x:Math.random(),y:Math.random(),r:.35+Math.random()*.3,s:.00004+Math.random()*.00006,p:Math.random()*6.28,o:i*36-54}));
function drawBg(t){
  hueNow+=((((hueTarget-hueNow)%360)+540)%360-180)*.04;
  const w=bg.width,h=bg.height,k=settings.motion?t:0;
  bx.fillStyle=`hsl(${hueNow} 45% 6%)`;bx.fillRect(0,0,w,h);
  bx.globalCompositeOperation='lighter';
  for(const b of blobs){const x=(b.x+Math.sin(k*b.s*6+b.p)*.12)*w,y=(b.y+Math.cos(k*b.s*5+b.p)*.1)*h,r=b.r*Math.max(w,h);
    const g=bx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`hsla(${hueNow+b.o} 70% 45% / .2)`);g.addColorStop(1,'hsla(0 0% 0% / 0)');bx.fillStyle=g;bx.fillRect(0,0,w,h);}
  bx.globalCompositeOperation='source-over';
  bx.strokeStyle=`hsla(${hueNow+30} 80% 75% / .07)`;bx.lineWidth=1.5;
  for(let j=0;j<3;j++){bx.beginPath();for(let i=0;i<=60;i++){const x=i/60*w,y=h*(.64+j*.06)+Math.sin(i/10+k*.0004+j)*h*.04;i?bx.lineTo(x,y):bx.moveTo(x,y);}bx.stroke();}
}

const held={left:false,right:false,up:false,down:false};let padHeld={},padX=0,padPrev=[],padIdx=null,padDir=null,padRep=0;

const KEYS={arrowleft:'left',arrowright:'right',arrowup:'up',arrowdown:'down',q:'left',a:'left',d:'right',z:'up',w:'up',s:'down',enter:'ok',' ':'ok',escape:'back',backspace:'back',h:'home'};
addEventListener('keydown',e=>{
  if(e.target&&e.target.tagName==='INPUT')return;
  const a=KEYS[e.key.toLowerCase()];if(!a)return;
  e.preventDefault();audio();
  if(a in held)held[a]=true;
  dispatch(a,'kbd');
});
addEventListener('keyup',e=>{const a=KEYS[e.key.toLowerCase()];if(a in held)held[a]=false;});

function updatePadStatus(p){const el=$('#pad-status');el.classList.toggle('on',!!p);el.querySelector('span').textContent=p?'Manette connectée':'Aucune manette';}
addEventListener('gamepadconnected',e=>{padIdx=e.gamepad.index;updatePadStatus(e.gamepad);toast('Manette connectée');sfx.ok();});
addEventListener('gamepaddisconnected',e=>{if(padIdx===e.gamepad.index){padIdx=null;updatePadStatus(null);toast('Manette déconnectée');}});
function getPad(){
  const ps=navigator.getGamepads?navigator.getGamepads():[];
  if(padIdx!=null&&ps[padIdx])return ps[padIdx];
  for(const p of ps)if(p){padIdx=p.index;updatePadStatus(p);return p;}
  return null;
}
const PADMAP={0:'ok',1:'back',9:'start',16:'home'};
function pollPad(t){
  const p=getPad();
  if(!p){padX=0;padHeld={};return;}
  p.buttons.forEach((b,i)=>{const on=b.pressed;if(on&&!padPrev[i]&&PADMAP[i])dispatch(PADMAP[i],'pad');padPrev[i]=on;});
  const ax=p.axes[0]||0,ay=p.axes[1]||0,B=i=>!!(p.buttons[i]&&p.buttons[i].pressed);
  padX=Math.abs(ax)>.18?ax:0;
  padHeld={left:B(14)||ax<-.5,right:B(15)||ax>.5,up:B(12)||ay<-.5,down:B(13)||ay>.5};
  let dir=B(14)?'left':B(15)?'right':B(12)?'up':B(13)?'down':null;
  if(!dir&&(Math.abs(ax)>.6||Math.abs(ay)>.6))dir=Math.abs(ax)>Math.abs(ay)?(ax>0?'right':'left'):(ay>0?'down':'up');
  if(dir){if(dir!==padDir){padDir=dir;padRep=t+380;dispatch(dir,'pad');}else if(t>padRep){padRep=t+130;dispatch(dir,'pad');}}
  else padDir=null;
}

let mode='boot',current=null,sel=store.get('sel',0);
function dispatch(a,src){
  if(mode==='boot'){startHome();return;}
  if(mode==='home'){if(a==='start')a='ok';homeInput(a);return;}
  if(mode==='app'){
    if(a==='home'){if(src==='kbd'&&current&&current.opaque)return;closeApp();return;}
    if(current&&current.input&&current.input(a,src))return;
    if(a==='back'||a==='start')closeApp();
  }
}
function startHome(){
  if(mode!=='boot')return;audio();sfx.boot();mode='home';
  $('#boot').classList.add('leaving');
  setTimeout(()=>{$('#boot').hidden=true;$('#home').hidden=false;select(sel,false);},settings.motion?650:0);
}

/* ---------- Outils communs aux jeux ---------- */
function rr(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function makeStage(body,land,port){
  const c=document.createElement('canvas');c.className='stage';body.append(c);
  const r0=body.getBoundingClientRect();const [W,H]=r0.height>r0.width*1.05?port:land;
  const d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;const ctx=c.getContext('2d');ctx.scale(d,d);
  const fit=()=>{const r=body.getBoundingClientRect();const s=Math.min(r.width/W,r.height/H);c.style.width=W*s+'px';c.style.height=H*s+'px';};
  fit();addEventListener('resize',fit);
  return{c,ctx,W,H,cleanup(){removeEventListener('resize',fit);}};
}
function overlay(body,title,text,label,onBtn){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML='<div class="card"><h2></h2><p></p><button class="btn"></button></div>';
  o.querySelector('h2').textContent=title;o.querySelector('p').textContent=text;
  const b=o.querySelector('button');b.textContent=label;b.addEventListener('click',onBtn);
  body.append(o);return o;
}
function textHint(ctx,W,y,msg){ctx.fillStyle='rgba(236,245,246,.8)';ctx.font='700 16px Manrope, system-ui, sans-serif';ctx.textAlign='center';ctx.fillText(msg,W/2,y);}

/* ---------- Jeu : Rebond ---------- */
function Rebond(body){
  const S=makeStage(body,[800,520],[480,660]),{ctx,W,H,c}=S;
  const cols=W>600?10:7,rows=5,gap=6,side=20,bw=(W-side*2-gap*(cols-1))/cols,bh=W>600?20:18;
  let bricks=[],ball,pad,lives,score,state,ov=null,mouseX=null,speed,last=0,parts=[];
  const hueOf=r=>8+r*12;
  function hud(){setScore('Score '+score+'  ·  Vies '+lives);}
  function newRound(){pad={w:W>600?124:104,h:14,x:W/2,y:H-36};ball={x:W/2,y:0,vx:0,vy:0,r:8};state='ready';hud();}
  function newGame(){
    lives=3;score=0;bricks=[];speed=W>600?6:5.4;
    for(let r=0;r<rows;r++)for(let k=0;k<cols;k++)bricks.push({x:side+k*(bw+gap),y:64+r*(bh+gap),r,alive:true});
    if(ov){ov.remove();ov=null;}newRound();
  }
  function serve(){
    if(state==='ready'){const a=-Math.PI/2+(Math.random()-.5)*.7;ball.vx=Math.cos(a)*speed;ball.vy=Math.sin(a)*speed;state='play';sfx.ok();}
    else if(state==='over'||state==='win'){newGame();sfx.ok();}
  }
  function end(win){state=win?'win':'over';win?sfx.win():sfx.bad();ov=overlay(body,win?'Mur pulvérisé !':'Partie terminée','Score final : '+score,'Rejouer',serve);}
  const toLocal=e=>{const r=c.getBoundingClientRect();return(e.clientX-r.left)/r.width*W;};
  c.addEventListener('pointermove',e=>{mouseX=toLocal(e);});
  c.addEventListener('pointerdown',e=>{mouseX=toLocal(e);if(state!=='play')serve();});
  function burst(x,y,h){for(let i=0;i<10;i++)parts.push({x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,life:1,h});}
  function physics(k){
    ball.x+=ball.vx*k;ball.y+=ball.vy*k;
    if(ball.x<ball.r){ball.x=ball.r;ball.vx=Math.abs(ball.vx);sfx.hit(300);}
    if(ball.x>W-ball.r){ball.x=W-ball.r;ball.vx=-Math.abs(ball.vx);sfx.hit(300);}
    if(ball.y<ball.r){ball.y=ball.r;ball.vy=Math.abs(ball.vy);sfx.hit(300);}
    if(ball.vy>0&&ball.y+ball.r>=pad.y-pad.h/2&&ball.y<pad.y+pad.h/2&&Math.abs(ball.x-pad.x)<pad.w/2+ball.r){
      const off=Math.max(-1,Math.min(1,(ball.x-pad.x)/(pad.w/2))),ang=off*1.05,sp=Math.hypot(ball.vx,ball.vy);
      ball.vx=Math.sin(ang)*sp;ball.vy=-Math.cos(ang)*sp;ball.y=pad.y-pad.h/2-ball.r;sfx.hit(420);
    }
    for(const b of bricks){
      if(!b.alive)continue;
      if(ball.x+ball.r>b.x&&ball.x-ball.r<b.x+bw&&ball.y+ball.r>b.y&&ball.y-ball.r<b.y+bh){
        b.alive=false;
        const px=ball.x-ball.vx*k;
        if(px+ball.r>b.x&&px-ball.r<b.x+bw)ball.vy=-ball.vy;else ball.vx=-ball.vx;
        score+=(rows-b.r)*10;
        const sp=Math.hypot(ball.vx,ball.vy),m=Math.min(sp*1.012,11)/sp;ball.vx*=m;ball.vy*=m;
        sfx.hit(560+(rows-b.r)*90);burst(b.x+bw/2,b.y+bh/2,hueOf(b.r));hud();
        if(bricks.every(x=>!x.alive))end(true);
        break;
      }
    }
    if(state==='play'&&ball.y-ball.r>H){lives--;hud();if(lives<=0)end(false);else{sfx.bad();newRound();}}
  }
  function draw(){
    ctx.clearRect(0,0,W,H);
    for(const b of bricks)if(b.alive){ctx.fillStyle=`hsl(${hueOf(b.r)} 88% ${64-b.r*3}%)`;rr(ctx,b.x,b.y,bw,bh,5);ctx.fill();}
    for(const p of parts){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=`hsl(${p.h} 90% 65%)`;ctx.fillRect(p.x-2,p.y-2,4,4);}
    ctx.globalAlpha=1;
    ctx.fillStyle='#ecf5f6';rr(ctx,pad.x-pad.w/2,pad.y-pad.h/2,pad.w,pad.h,7);ctx.fill();
    ctx.shadowColor='#ffb46a';ctx.shadowBlur=16;ctx.fillStyle='#ffd6a8';ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();ctx.shadowBlur=0;
    if(state==='ready')textHint(ctx,W,H/2+40,'Entrée, bouton A ou clic pour lancer');
  }
  function update(t){
    const k=last?Math.min((t-last)/16.67,2.5):1;last=t;
    let dx=(isHeld('left')?-1:0)+(isHeld('right')?1:0);if(padX)dx=padX;
    if(dx){pad.x+=dx*10*k;mouseX=null;}else if(mouseX!=null)pad.x+=(mouseX-pad.x)*Math.min(1,.4*k);
    pad.x=Math.max(pad.w/2,Math.min(W-pad.w/2,pad.x));
    if(state==='ready'){ball.x=pad.x;ball.y=pad.y-pad.h/2-ball.r-1;}
    if(state==='play'){physics(k/2);if(state==='play')physics(k/2);}
    parts=parts.filter(p=>(p.life-=.03*k)>0);parts.forEach(p=>{p.x+=p.vx*k;p.y+=p.vy*k;p.vy+=.15*k;});
    draw();
  }
  newGame();
  return{hint:'← → ou souris · Entrée / A pour lancer',update,input(a){if(a==='ok'){serve();return true;}return false;},destroy(){S.cleanup();}};
}

/* ---------- Jeu : Serpent ---------- */
function Serpent(body){
  const S=makeStage(body,[800,520],[480,640]),{ctx,W,H,c}=S,CS=20,GC=W/CS,GR=H/CS;
  const DIRS={left:{x:-1,y:0},right:{x:1,y:0},up:{x:0,y:-1},down:{x:0,y:1}};
  let snake,dir,queue,food,score,best=store.get('best-serpent',0),state,stepMs,acc=0,last=0,ov=null,pulse=0;
  function hud(){setScore('Score '+score+'  ·  Record '+best);}
  function placeFood(){do{food={x:Math.floor(Math.random()*GC),y:Math.floor(Math.random()*GR)};}while(snake.some(s=>s.x===food.x&&s.y===food.y));}
  function newGame(){
    const cx=Math.floor(GC/2),cy=Math.floor(GR/2);
    snake=[{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];dir=DIRS.right;queue=[];score=0;stepMs=115;acc=0;
    placeFood();state='ready';if(ov){ov.remove();ov=null;}hud();
  }
  function start(){if(state==='ready'){state='play';sfx.ok();}else if(state==='over'){newGame();state='play';sfx.ok();}}
  function turn(name){
    const d=DIRS[name],ref=queue.length?queue[queue.length-1]:dir;
    if(d===ref||(d.x===-ref.x&&d.y===-ref.y)){if(state==='ready'&&d===ref)start();return;}
    if(queue.length<3)queue.push(d);
    if(state==='ready')start();
  }
  function step(){
    if(queue.length)dir=queue.shift();

    const hp=Math.max(0,Math.ceil(P.hp));setT(hpB,hp);setS(hpI,'width',hp+'%');setS(hpI,'background',P.hp<35?'#ff5a5f':'#f4fbfb');
    setT(ammoB,P.reload>0?'…':P.ammo);setT(ammoE,P.reload>0?'Rechargement':'/ '+MAG);
    const sp=Math.hypot(vel.x,vel.z),gap=4+Math.min(P.spray,10)*1.6+(sp>2.6?sp*1.4:0)+(P.ground?0:14);
    setS(xh,'--gap',Math.round(P.aiming?gap*.45:gap)+'px');setS(xh,'opacity',P.alive?'1':'0');
    const onT=aimInfo&&aimInfo.m<.6;xh.classList.toggle('on',!!onT);setT(tagEl,onT?aimInfo.b.name:'');
    topT-=dt;if(topT<=0){topT=.2;const lead=[...bots].sort((a,b)=>b.kills-a.kills)[0];
      topc.innerHTML=`<span>Toi <b>${P.kills}</b></span><span class="sep">objectif ${cfg.goal}</span>${lead?`<span>${lead.name} <b>${lead.kills}</b></span>`:''}<span class="sep">${fmtTime(matchT)}</span>`;}
    hmT=Math.max(0,hmT-dt);setS(hm,'opacity',hmT>0?'1':'0');
    dmgT=Math.max(0,dmgT-dt);setS(dmgEl,'opacity',Math.max(dmgT/.6*.9,P.alive&&P.hp<35?.35:0).toFixed(2));
    hitDirT=Math.max(0,hitDirT-dt);setS(hitDir,'opacity',hitDirT.toFixed(2));
    popT=Math.max(0,popT-dt);setS(popEl,'opacity',Math.min(1,popT*2).toFixed(2));
    board.hidden=!(boardHeld||boardPad);if(!board.hidden&&(boardT-=dt)<=0){boardT=.3;board.innerHTML=boardHTML();}
    const k=120/(MW*CS);mm.clearRect(0,0,120,120);mm.drawImage(mmBase,0,0);
    for(const b of bots)if(b.alive&&b.shotT>0){mm.globalAlpha=Math.min(1,b.shotT);mm.fillStyle='#ff5a5f';mm.beginPath();mm.arc(b.x*k,b.z*k,3,0,7);mm.fill();}
    mm.globalAlpha=1;
    if(P.alive){mm.save();mm.translate(P.x*k,P.z*k);mm.rotate(-P.yaw);mm.fillStyle='#ffb46a';mm.beginPath();mm.moveTo(0,-6);mm.lineTo(4,4);mm.lineTo(-4,4);mm.closePath();mm.fill();mm.restore();}
  }
  function update(t){
    if(dead||!renderer)return;
    const raw=last?(t-last)/1000:.016,dt=Math.min(raw,.05);last=t;now+=dt;
    fpsN++;fpsAcc+=raw;if(fpsAcc>=.5){setT(fpsEl,Math.round(fpsN/fpsAcc)+' i/s'+(cfg.quality===0?' · résolution '+Math.round(dynPR*100)+' %':''));fpsN=0;fpsAcc=0;}
    if(state==='play'&&cfg.quality===0){perfN++;perfAcc+=raw;if(perfAcc>=1.5){const f=perfN/perfAcc;perfN=0;perfAcc=0;
      if(f<45&&dynPR>.5){dynPR=Math.max(.5,dynPR-.125);upOk=0;renderer.setPixelRatio(dynPR);resize();}
      else if(f>57&&dynPR<1){if(++upOk>=2){upOk=0;dynPR=Math.min(1,dynPR+.125);renderer.setPixelRatio(dynPR);resize();}}
      else upOk=0;}}
    if(state==='play')step(dt);
    else if(state==='menu'){const a=now*.08,c={x:MW*CS/2,z:MH*CS/2};cam.position.set(c.x+Math.cos(a)*15,9,c.z+Math.sin(a)*15);cam.lookAt(c.x,1,c.z);cam.fov=74;cam.updateProjectionMatrix();}
    for(const tr of tracers){if(tr.life>0){tr.life-=dt;tr.l.material.opacity=Math.max(0,tr.life/.08)*.85;}else tr.l.material.opacity=0;}
    for(const s of sparks)if(s.life>0){s.life-=dt;const k=Math.max(0,s.life/.22);s.m.scale.setScalar(.4+k);s.m.material.opacity=k;if(s.life<=0)s.m.visible=false;}
    vmAim+=((P.aiming?1:0)-vmAim)*Math.min(1,dt*12);vmKick=Math.max(0,vmKick-dt*9);
    const rk=P.reload>0?Math.sin(clamp(1-P.reload/RELOAD,0,1)*Math.PI):0,bx=Math.sin(bob)*.012*(1-vmAim),by=Math.abs(Math.cos(bob))*.012*(1-vmAim);
    vm.position.set(lerp(.2,0,vmAim)+bx,lerp(-.19,-.118,vmAim)-by-rk*.18,lerp(-.4,-.32,vmAim)+vmKick*.05);
    vm.rotation.set(vmKick*.08+rk*.6,0,rk*.3);
    flash.visible=flashT>0;if(flashT>0){flash.rotation.z=Math.random()*6;flashT-=dt;}
    muzzleLight.intensity=flash.visible?2.2:0;muzzleLight.position.copy(cam.position);
    renderer.clear();renderer.render(scene,cam);
    if(state!=='menu'&&P.alive){renderer.clearDepth();renderer.render(vmScene,vmCam);}
  }
  function input(a,src){
    lastSrc=src;if(state==='loading')return false;
    if(state==='play'){if(a==='start'||(a==='back'&&src!=='pad'))pauseMenu();return true;}
    if(state==='pause'){if(a==='back'||a==='start'){if(performance.now()-pausedAt>300)resume();return true;}return menuInput(a);}
    if(state==='end'){if(a==='back'){mainMenu();return true;}return menuInput(a);}
    if(state==='menu'){if(a==='back')return false;return menuInput(a);}
    return false;
  }
  function destroy(){
    dead=true;releaseLock();
    removeEventListener('keydown',onKD);removeEventListener('keyup',onKU);removeEventListener('mousedown',onMD);removeEventListener('mouseup',onMU);removeEventListener('mousemove',onMM);
    document.removeEventListener('pointerlockchange',onPLC);document.removeEventListener('pointerlockerror',onPLE);
    if(ro)ro.disconnect();else removeEventListener('resize',resize);
    if(renderer){
      const free3=o=>{if(o.geometry)o.geometry.dispose();if(o.material)[].concat(o.material).forEach(m=>{if(m.map)m.map.dispose();m.dispose();});};
      scene.traverse(free3);vmScene.traverse(free3);renderer.dispose();if(renderer.forceContextLoss)renderer.forceContextLoss();
    }
  }
  loadThree().then(()=>{if(!dead)init();}).catch(()=>{if(!dead)menu.innerHTML='<div class="fps-panel"><h2>Impact</h2><p class="sub">Le moteur 3D n’a pas pu se charger. Vérifie ta connexion puis relance le jeu.</p></div>';});
  return{opaque:true,hint:touchMode?'Glisse à gauche pour bouger, à droite pour viser':'Échap ou Start pour la pause · Tab pour le classement',update,input,destroy};
}

/* ---------- Démarrage ---------- */
function frame(t){if(!(current&&current.opaque))drawBg(t);pollPad(t);if(current&&current.update)current.update(t);requestAnimationFrame(frame);}
renderRail();updatePadStatus(null);
let pname=store.get('name','Joueur');
function showName(){$('#pname').textContent=pname;$('#avatar').textContent=(pname.trim()[0]||'J').toUpperCase();}
showName();
$('#profile').addEventListener('click',()=>{const i=$('#pname-in');i.value=pname;$('#profile').hidden=true;i.hidden=false;i.focus();i.select();});
function saveName(){const i=$('#pname-in');if(i.hidden)return;const v=i.value.trim().slice(0,16);if(v){pname=v;store.set('name',pname);}i.hidden=true;$('#profile').hidden=false;showName();}
$('#pname-in').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key==='Escape'){e.preventDefault();if(e.key==='Escape')e.target.value=pname;saveName();}});
$('#pname-in').addEventListener('blur',saveName);
$('#boot').addEventListener('pointerdown',()=>dispatch('ok','ptr'));
$('#d-launch').addEventListener('click',()=>{audio();launch(sel);});
$('#app-back').addEventListener('click',()=>{if(mode==='app')closeApp();});
requestAnimationFrame(frame);
</script>
